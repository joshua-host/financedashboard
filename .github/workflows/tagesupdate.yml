name: Tagesupdate

on:
  schedule:
    # Uhrzeiten in UTC (kein automatisches DST-Handling - siehe README).
    # 11:30 UTC ≈ kurz vor US-Markteröffnung, 21:00 UTC ≈ kurz nach US-Marktschluss.
    - cron: "30 11 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}  # manueller "Run workflow"-Button zum Testen

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tagesupdate erzeugen
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python tagesupdate.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "tagesupdate-bot"
          git config --global user.email "actions@users.noreply.github.com"
          git add tagesupdate.txt tagesupdate.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen - kein Commit nötig."
          else
            git commit -m "Tagesupdate: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
