<!DOCTYPE html>
<html lang="de" data-theme="dark" data-lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FA Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--mono:'Courier New',Courier,monospace;--sans:'Segoe UI',system-ui,-apple-system,sans-serif;--radius:8px;--tr:0.18s ease;}
[data-theme="dark"]{--bg:#0d0f12;--sur:#151820;--sur2:#1c2030;--bdr:#252a38;--acc:#4fffb0;--acc2:#38b2ff;--dan:#ff4f6a;--wrn:#ffc93c;--tx:#e8eaf0;--txd:#6b7590;--txm:#9ba3be;--tabbg:#1c2030;--tabac:#151820;--inbg:#0d0f12;--sh:0 2px 16px rgba(0,0,0,0.4);}
[data-theme="light"]{--bg:#f4f6fb;--sur:#fff;--sur2:#eef1f8;--bdr:#dde2ee;--acc:#0a7c4e;--acc2:#1565c0;--dan:#c62828;--wrn:#b45309;--tx:#111827;--txd:#9ba3be;--txm:#4a5270;--tabbg:#eef1f8;--tabac:#fff;--inbg:#fff;--sh:0 2px 16px rgba(0,0,0,0.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;transition:background var(--tr),color var(--tr);}
header{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--sh);}
.logo{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--acc);letter-spacing:0.1em;display:flex;align-items:center;gap:0.4rem;}
.logo span{color:var(--acc2);}
.hctrl{display:flex;align-items:center;gap:0.6rem;}
.tbtn{background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:0.28rem 0.8rem;font-size:0.76rem;font-family:var(--mono);color:var(--txm);cursor:pointer;transition:all var(--tr);letter-spacing:0.05em;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);}
.tabs{display:flex;background:var(--tabbg);border-bottom:1px solid var(--bdr);padding:0 2rem;}
.tab{padding:0.8rem 1.4rem;font-size:0.84rem;font-weight:600;cursor:pointer;color:var(--txd);border-bottom:2px solid transparent;transition:all var(--tr);user-select:none;}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);background:var(--tabac);}
.panel{display:none;padding:2rem;max-width:1120px;margin:0 auto;}
.panel.active{display:block;}
.scard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);padding:1.5rem 2rem;margin-bottom:1.5rem;box-shadow:var(--sh);}
.slbl{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.6rem;}
.srow{display:flex;gap:0.7rem;align-items:center;flex-wrap:wrap;}
#ticker-input{font-family:var(--mono);font-size:1.3rem;font-weight:700;background:var(--inbg);border:1.5px solid var(--bdr);border-radius:var(--radius);color:var(--tx);padding:0.55rem 1rem;width:195px;letter-spacing:0.14em;text-transform:uppercase;outline:none;transition:border-color var(--tr);}
#ticker-input:focus{border-color:var(--acc);}
#ticker-input::placeholder{color:var(--txd);font-weight:400;letter-spacing:0.04em;font-size:1rem;}
.sbtn{background:var(--acc);color:#0d0f12;border:none;border-radius:var(--radius);padding:0.6rem 1.5rem;font-size:0.86rem;font-weight:700;font-family:var(--mono);letter-spacing:0.06em;cursor:pointer;transition:opacity var(--tr);}
.sbtn:hover{opacity:0.85;}
.sbtn:disabled{opacity:0.35;cursor:not-allowed;}
.status{font-family:var(--mono);font-size:0.76rem;margin-top:0.55rem;min-height:1.1rem;display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;}
.status.loading{color:var(--acc2);}
.status.error{color:var(--dan);}
.status.ok{color:var(--acc);}
.status.warn{color:var(--wrn);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
.cohdr{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);padding:1.2rem 1.6rem;margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;box-shadow:var(--sh);}
.coname{font-size:1.45rem;font-weight:700;line-height:1.2;}
.cometa{font-family:var(--mono);font-size:0.76rem;color:var(--txd);margin-top:0.25rem;}
.codesc{font-size:0.82rem;color:var(--txm);margin-top:0.5rem;max-width:540px;line-height:1.6;}
.pval{font-family:var(--mono);font-size:1.7rem;font-weight:700;color:var(--acc);text-align:right;}
.pchg{font-family:var(--mono);font-size:0.8rem;margin-top:0.15rem;text-align:right;}
.pos{color:#4fffb0;}.neg{color:var(--dan);}
.stitle{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.12em;text-transform:uppercase;margin:1.4rem 0 0.7rem;padding-left:2px;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:0.8rem;margin-bottom:0.5rem;}
.mc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);padding:0.85rem 1rem;box-shadow:var(--sh);}
.mlbl{font-family:var(--mono);font-size:0.66rem;color:var(--txd);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:0.28rem;}
.mv{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--tx);}
.mv.a{color:var(--acc);}.mv.b{color:var(--acc2);}
.twrap{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);margin-bottom:1.4rem;}
table{width:100%;border-collapse:collapse;}
th{background:var(--sur2);color:var(--txd);font-family:var(--mono);font-size:0.69rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.65rem 1rem;text-align:left;border-bottom:1px solid var(--bdr);}
td{padding:0.75rem 1rem;border-bottom:1px solid var(--bdr);font-size:0.85rem;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--sur2);}
tr.sumrow td{background:var(--sur2);font-weight:700;border-top:2px solid var(--bdr);}
.badge{display:inline-block;font-family:var(--mono);font-weight:700;font-size:0.85rem;padding:0.15rem 0.5rem;border-radius:4px;white-space:nowrap;border:1px solid;}
.badge.hi{color:#4fffb0;border-color:#4fffb0;background:rgba(79,255,176,0.07);}
.badge.mi{color:#ffc93c;border-color:#ffc93c;background:rgba(255,201,60,0.07);}
.badge.lo{color:var(--dan);border-color:var(--dan);background:rgba(255,79,106,0.07);}
.badge.tot{color:var(--acc2);border-color:var(--acc2);background:rgba(56,178,255,0.10);font-size:0.95rem;}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.4rem;}
.cc{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--sh);}
.cc.full{grid-column:1/-1;}
.ctitle{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:0.9rem;}
.cwrap{position:relative;height:215px;}
.dcfw{position:relative;height:330px;}
.notice{font-family:var(--mono);font-size:0.71rem;color:var(--txd);background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--radius);padding:0.7rem 1rem;margin-bottom:1rem;}
.disc{font-size:0.7rem;color:var(--txd);border-top:1px solid var(--bdr);padding-top:1rem;margin-top:1.4rem;line-height:1.65;font-family:var(--mono);}
.hempty{text-align:center;padding:3rem;color:var(--txd);font-family:var(--mono);font-size:0.84rem;}
.hlist{display:flex;flex-direction:column;gap:0.7rem;}
.hi2{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:var(--sh);cursor:pointer;transition:border-color var(--tr);}
.hi2:hover{border-color:var(--acc);}
.htk{font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--acc);margin-bottom:0.18rem;}
.hco{font-size:0.85rem;color:var(--txm);margin-bottom:0.3rem;}
.hm{font-family:var(--mono);font-size:0.7rem;color:var(--txd);}
.hact{display:flex;gap:0.45rem;margin-left:1rem;flex-direction:column;align-items:flex-end;}
.bsm{font-family:var(--mono);font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:4px;cursor:pointer;border:1px solid var(--bdr);background:var(--sur2);color:var(--txm);transition:all var(--tr);white-space:nowrap;}
.bsm:hover{color:var(--tx);border-color:var(--acc2);}
.bsm.del:hover{color:var(--dan);border-color:var(--dan);}
.bsm.view{color:var(--acc2);border-color:var(--acc2);}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;overflow-y:auto;padding:2rem;}
#overlay.on{display:block;}
.ovp{background:var(--bg);max-width:1120px;margin:0 auto;border-radius:var(--radius);border:1px solid var(--bdr);overflow:hidden;}
.ovh{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0.9rem 1.4rem;display:flex;justify-content:space-between;align-items:center;}
.ovt{font-family:var(--mono);font-size:0.76rem;color:var(--txd);letter-spacing:0.1em;}
.xbtn{font-family:var(--mono);background:none;border:1px solid var(--bdr);color:var(--txm);border-radius:4px;padding:0.22rem 0.7rem;cursor:pointer;transition:all var(--tr);}
.xbtn:hover{border-color:var(--dan);color:var(--dan);}
.ovc{padding:1.4rem;}
@media(max-width:680px){.cgrid{grid-template-columns:1fr;}.panel{padding:1rem;}header{padding:0 1rem;}.tabs{padding:0 1rem;}}
</style>
</head>
<body>
<header>
  <div class="logo">FA<span>::</span>DASHBOARD</div>
  <div class="hctrl">
    <button class="tbtn" id="lang-btn" onclick="toggleLang()">EN</button>
    <button class="tbtn" id="theme-btn" onclick="toggleTheme()">☀ LIGHT</button>
  </div>
</header>
<div class="tabs">
  <div class="tab active" id="tab-analyse" onclick="switchTab('analyse')">Analyse</div>
  <div class="tab" id="tab-history" onclick="switchTab('history')">Verlauf &amp; Favoriten</div>
</div>
<div class="panel active" id="panel-analyse">
  <div class="scard">
    <div class="slbl">Ticker-Symbol eingeben (US-Börsen)</div>
    <div class="srow">
      <input type="text" id="ticker-input" placeholder="z.B. AAPL" autocomplete="off" spellcheck="false">
      <button class="sbtn" id="sbtn" onclick="startAnalysis()">Analysieren</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div id="results"></div>
</div>
<div class="panel" id="panel-history">
  <div class="stitle">Gespeicherte Analysen (max. 10)</div>
  <div id="hlist"></div>
</div>
<div id="overlay">
  <div class="ovp">
    <div class="ovh">
      <div class="ovt" id="ovt">GESPEICHERTE ANALYSE</div>
      <button class="xbtn" onclick="closeOv()">✕ Schließen</button>
    </div>
    <div class="ovc" id="ovc"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const AV_KEY = '257I8SPOACMY8DXS';
const AV     = 'https://www.alphavantage.co/query';
const MAX_H  = 10;

// ═══════════════════════════════════
// LANG / THEME
// ═══════════════════════════════════
let lang='de', theme='dark';
function toggleTheme(){theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);document.getElementById('theme-btn').textContent=theme==='dark'?'☀ LIGHT':'☾ DARK';reRC();}
function toggleLang(){lang=lang==='de'?'en':'de';document.documentElement.setAttribute('data-lang',lang);document.getElementById('lang-btn').textContent=lang==='de'?'EN':'DE';}

// ═══════════════════════════════════
// TABS
// ═══════════════════════════════════
function switchTab(n){
  ['analyse','history'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===n);
    document.getElementById('panel-'+t).classList.toggle('active',t===n);
  });
  if(n==='history')renderH();
}

// ═══════════════════════════════════
// STORAGE
// ═══════════════════════════════════
function getH(){try{return JSON.parse(localStorage.getItem('fa_av')||'[]');}catch{return[];}}
function saveH(a){localStorage.setItem('fa_av',JSON.stringify(a.slice(0,MAX_H)));}
function addH(e){let h=getH().filter(x=>x.ticker!==e.ticker);h.unshift(e);saveH(h);}
function delH(t){saveH(getH().filter(e=>e.ticker!==t));renderH();}

// ═══════════════════════════════════
// STATUS
// ═══════════════════════════════════
function setStatus(msg,type=''){
  const el=document.getElementById('status');
  el.className='status '+type;
  el.innerHTML=type==='loading'?`<span class="spin"></span>${msg}`:msg;
}

// ═══════════════════════════════════
// ALPHA VANTAGE FETCH
// ═══════════════════════════════════
async function av(params){
  const url=AV+'?'+new URLSearchParams({...params,apikey:AV_KEY});
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  // Rate limit check
  if(d['Note']||d['Information']){
    const msg=d['Note']||d['Information'];
    throw new Error('API-Limit: '+msg.substring(0,120));
  }
  if(d['Error Message']) throw new Error(d['Error Message']);
  return d;
}

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════
function fB(v){if(v==null||isNaN(v))return'N/A';const a=Math.abs(v);if(a>=1e12)return(v/1e12).toFixed(2)+' T';if(a>=1e9)return(v/1e9).toFixed(2)+' B';if(a>=1e6)return(v/1e6).toFixed(2)+' M';return Number(v).toLocaleString();}
function nf(v,d=2,s=''){if(v==null||v===''||v==='None'||isNaN(Number(v)))return'N/A';return Number(v).toFixed(d)+s;}
function pct(v){return nf(v==null?null:v*100,1,'%');}
function nn(v){return(v==null||v==='-'||v==='None'||v==='')?null:Number(v);}

// Parse AV annual reports — returns array newest-first, max 5
function parseAnnual(data, key){
  if(!data||!data[key]) return [];
  return (data[key]).slice(0,5);
}

function calcCAGR(reports, field){
  const vals=reports.map(r=>nn(r[field])).filter(v=>v!=null&&v>0);
  if(vals.length<2) return null;
  const last=vals[0], first=vals[vals.length-1];
  return Math.pow(last/first,1/(vals.length-1))-1;
}

function dcfEst(cfReports){
  try{
    const fcfs=cfReports.map(r=>nn(r.operatingCashflow)).filter(v=>v!=null&&v>0);
    if(!fcfs.length) return null;
    const avg=fcfs.reduce((a,b)=>a+b,0)/fcfs.length;
    const g=0.05,r=0.09,n=5;
    let pv=0;for(let i=1;i<=n;i++)pv+=(avg*Math.pow(1+g,i))/Math.pow(1+r,i);
    const tv=(avg*Math.pow(1+g,n)*1.02)/((r-0.02)*Math.pow(1+r,n));
    const sh=nn(cfReports[0]?.commonStockSharesOutstanding)||nn(cfReports[0]?.shares);
    if(!sh||sh<=0) return null;
    return(pv+tv)/sh;
  }catch{return null;}
}

// ═══════════════════════════════════
// RATINGS
// ═══════════════════════════════════
function calcRatings(d){
  function sc(v,g,ok,b,inv=false){
    if(v==null||isNaN(v))return 5;
    if(!inv)return v>=g?9:v>=ok?6:v>=b?3:2;
    return v<=g?9:v<=ok?6:v<=b?3:2;
  }
  function cl(v){return Math.max(1,Math.min(10,Math.round(v)));}
  const r1=cl((sc(d.gm,0.5,0.3,0.15)+sc(d.rev5,0.15,0.07,0.02))/2);
  const r2=cl((sc(d.rev5,0.15,0.07,0.02)+sc(d.roe,0.2,0.12,0.06)+sc(d.roic,0.15,0.09,0.04)+sc(d.de,0.5,1.5,3,true))/4);
  let vs=5;if(d.pe!=null&&!isNaN(d.pe))vs=d.pe<12?9:d.pe<18?7:d.pe<28?5:d.pe<40?3:2;
  const v2=d.ev!=null?(d.ev<10?9:d.ev<18?6:d.ev<30?4:2):5;
  const r3=cl((vs+v2)/2);
  const r4=cl(sc(d.roic,0.18,0.10,0.05));
  const r5=5,r8=5;
  const r6=cl((sc(d.cr,2,1.2,0.8)+sc(d.de,0.3,1,2.5,true))/2);
  const r7=cl(sc(d.rev5,0.2,0.1,0.03));
  const tot=cl((r1+r2+r3+r4+r5+r6+r7+r8)/8);
  const lDE=['Geschäftsmodell & Wettbewerbsposition','Finanzkennzahlen','Bewertung','Management & Governance','Branche & makroökonom. Umfeld','Bilanzqualität & Risiken','Katalysatoren (2–5 Jahre)','Sentiment & Kontraindikatoren'];
  const lEN=['Business Model & Competitive Position','Financial Metrics','Valuation','Management & Governance','Industry & Macro Environment','Balance Sheet Quality & Risks','Catalysts (2–5 Years)','Sentiment & Counter-Indicators'];
  return{sc:[r1,r2,r3,r4,r5,r6,r7,r8],tot,lDE,lEN};
}

// ═══════════════════════════════════
// CHARTS
// ═══════════════════════════════════
let CD=null, CI={};
function killC(){Object.values(CI).forEach(c=>{try{c.destroy();}catch{}});CI={};}
function getC(){const dk=document.documentElement.getAttribute('data-theme')==='dark';return{a:dk?'#4fffb0':'#0a7c4e',b:dk?'#38b2ff':'#1565c0',w:'#ffc93c',d:dk?'#ff4f6a':'#c62828',g:dk?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.07)',t:dk?'#6b7590':'#9ba3be',bd:dk?'#252a38':'#dde2ee'};}
function reRC(){if(CD)drawC(CD);}

function drawC(cd){
  killC();
  const c=getC(),de=lang==='de';
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:c.t,font:{family:"'Courier New',monospace",size:11}}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}},y:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}}}};

  const pe=document.getElementById('c-pe');
  if(pe)CI.pe=new Chart(pe,{type:'line',data:{labels:cd.yrs,datasets:[{label:de?'KGV':'P/E',data:cd.peH,borderColor:c.a,backgroundColor:c.a+'18',borderWidth:2,pointBackgroundColor:c.a,pointRadius:4,fill:true,tension:0.3}]},options:{...base}});

  const mg=document.getElementById('c-mg');
  if(mg)CI.mg=new Chart(mg,{type:'line',data:{labels:cd.yrs,datasets:[
    {label:de?'Bruttomarge %':'Gross %',data:cd.gmH,borderColor:c.a,borderWidth:2,pointRadius:4,tension:0.3,fill:false},
    {label:de?'Op. Marge %':'Op. %',data:cd.omH,borderColor:c.b,borderWidth:2,pointRadius:4,tension:0.3,fill:false},
    {label:de?'Nettomarge %':'Net %',data:cd.nmH,borderColor:c.w,borderWidth:2,pointRadius:4,tension:0.3,fill:false}
  ]},options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v!=null?v.toFixed(1)+'%':null}}}}});

  const rv=document.getElementById('c-rv');
  if(rv)CI.rv=new Chart(rv,{type:'bar',data:{labels:cd.yrs,datasets:[
    {label:de?'Umsatz (Mrd.)':'Revenue (B)',data:cd.revH.map(v=>v?(v/1e9).toFixed(2):null),backgroundColor:c.a+'55',borderColor:c.a,borderWidth:1,yAxisID:'y'},
    {label:'Net Debt/EBITDA',data:cd.ndH,type:'line',borderColor:c.d,borderWidth:2,pointRadius:4,yAxisID:'y1',tension:0.3}
  ]},options:{...base,scales:{x:base.scales.x,y:{...base.scales.y,position:'left',title:{display:true,text:de?'Mrd. USD':'B USD',color:c.t,font:{size:10}}},y1:{...base.scales.y,position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'ND/EBITDA',color:c.d,font:{size:10}}}}}});

  const de2=document.getElementById('c-dcf');
  if(de2&&cd.price){
    const cp=cd.price,ath=cd.ath||cp*1.4,dcf=cd.dcf||null;
    const maxY=Math.max(cp,ath,dcf||0)*1.2;
    CI.dcf=new Chart(de2,{type:'bar',
      data:{labels:[cd.ticker],datasets:[{data:[maxY],backgroundColor:c.a+'10',borderColor:c.bd,borderWidth:1}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{color:c.g},ticks:{color:c.t}},y:{min:0,max:maxY,grid:{color:c.g},ticks:{color:c.t,callback:v=>'$'+v.toFixed(0)}}}},
      plugins:[{id:'dcfL',afterDraw(chart){
        const{ctx,chartArea,scales}=chart;if(!chartArea)return;
        const yS=scales.y,x0=chartArea.left,x1=chartArea.right;
        function ln(val,color,label,oY=0){
          if(val==null||isNaN(val))return;
          const y=yS.getPixelForValue(val);
          ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
          ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
          ctx.setLineDash([]);ctx.fillStyle=color;ctx.font='bold 11px Courier New,monospace';
          ctx.textAlign='left';ctx.fillText(label+': $'+Number(val).toFixed(2),x0+8,y-6+oY);ctx.restore();
        }
        const aY=yS.getPixelForValue(ath),cY=yS.getPixelForValue(cp);
        ln(ath,c.b,de?'52W-Hoch':'52W-High',0);
        ln(cp,c.a,de?'Aktueller Kurs':'Current Price',Math.abs(aY-cY)<20?14:0);
        if(dcf!=null)ln(dcf,c.w,de?'Fairer Wert (DCF)':'DCF Fair Value',Math.abs(cY-yS.getPixelForValue(dcf))<20?14:0);
      }}]
    });
  }
}

// ═══════════════════════════════════
// MAIN ANALYSIS
// ═══════════════════════════════════
async function startAnalysis(){
  const ticker=document.getElementById('ticker-input').value.trim().toUpperCase();
  if(!ticker){setStatus('Bitte einen Ticker eingeben.','error');return;}

  document.getElementById('sbtn').disabled=true;
  document.getElementById('results').innerHTML='';
  killC();CD=null;

  // Alpha Vantage: sequenziell wegen 5-calls/min Limit auf Free-Plan
  // Wir nutzen 4 Calls: OVERVIEW, INCOME_STATEMENT, BALANCE_SHEET, CASH_FLOW
  const steps=[
    'Unternehmensprofil laden…',
    'Income Statement abrufen…',
    'Bilanz laden…',
    'Cashflow laden…',
    'Analyse erstellen…'
  ];
  let si=0;setStatus(steps[0],'loading');

  try{
    // ── 1. OVERVIEW ──────────────────────
    const ov=await av({function:'OVERVIEW',symbol:ticker});
    if(!ov.Symbol){
      setStatus(`Ticker „${ticker}" nicht gefunden. Nur US-Börsen (NYSE/NASDAQ). Beispiele: AAPL · MSFT · NVDA · AMZN · TSLA`,'error');
      document.getElementById('sbtn').disabled=false;
      return;
    }
    si=1;setStatus(steps[1],'loading');
    await delay(500);

    // ── 2. INCOME STATEMENT ──────────────
    const inc=await av({function:'INCOME_STATEMENT',symbol:ticker});
    si=2;setStatus(steps[2],'loading');
    await delay(500);

    // ── 3. BALANCE SHEET ─────────────────
    const bal=await av({function:'BALANCE_SHEET',symbol:ticker});
    si=3;setStatus(steps[3],'loading');
    await delay(500);

    // ── 4. CASH FLOW ─────────────────────
    const cf=await av({function:'CASH_FLOW',symbol:ticker});
    si=4;setStatus(steps[4],'loading');

    // ── Parse annual reports ──────────────
    const incA=parseAnnual(inc,'annualReports');
    const balA=parseAnnual(bal,'annualReports');
    const cfA =parseAnnual(cf,'annualReports');

    // ── Key metrics from OVERVIEW ─────────
    const price    = nn(ov['50DayMovingAverage']) || nn(ov.AnalystTargetPrice) || null;
    // Use current price from AV overview fields
    const curPrice = nn(ov['200DayMovingAverage']) || null; // fallback
    const ath52    = nn(ov['52WeekHigh']);
    const mktCap   = nn(ov.MarketCapitalization);
    const pe       = nn(ov.PERatio);
    const pb       = nn(ov.PriceToBookRatio);
    const ps       = nn(ov.PriceToSalesRatioTTM);
    const ev       = nn(ov.EVToEBITDA);
    const eps      = nn(ov.EPS);
    const roe      = nn(ov.ReturnOnEquityTTM);
    const roic     = null; // not in AV free
    const beta     = nn(ov.Beta);
    const divYield = nn(ov.DividendYield);
    const fwdPE    = nn(ov.ForwardPE);
    const analystTarget = nn(ov.AnalystTargetPrice);

    // ── Computed from statements ──────────
    // Gross margin from income
    const gm = incA.length ? (()=>{
      const r=incA[0];
      const rev=nn(r.totalRevenue), gp=nn(r.grossProfit);
      return(rev&&gp&&rev>0)?gp/rev:null;
    })() : null;

    // Operating margin
    const om = incA.length ? (()=>{
      const r=incA[0];
      const rev=nn(r.totalRevenue), op=nn(r.operatingIncome);
      return(rev&&op&&rev>0)?op/rev:null;
    })() : null;

    // Net margin
    const nm = incA.length ? (()=>{
      const r=incA[0];
      const rev=nn(r.totalRevenue), ni=nn(r.netIncome);
      return(rev&&ni&&rev>0)?ni/rev:null;
    })() : null;

    // Revenue CAGR 5Y
    const rev5=calcCAGR(incA,'totalRevenue');

    // Debt/Equity from balance
    const de2 = balA.length ? (()=>{
      const b=balA[0];
      const td=nn(b.totalLiabilities)||nn(b.shortLongTermDebtTotal);
      const eq=nn(b.totalShareholderEquity);
      return(td&&eq&&eq>0)?td/eq:null;
    })() : null;

    // Current Ratio
    const cr = balA.length ? (()=>{
      const b=balA[0];
      const ca=nn(b.totalCurrentAssets),cl2=nn(b.totalCurrentLiabilities);
      return(ca&&cl2&&cl2>0)?ca/cl2:null;
    })() : null;

    // DCF
    const dcf=dcfEst(cfA);

    // Net Debt/EBITDA per year
    const ndH=incA.map((inc2,i)=>{
      const b=balA[i]||{};
      const nd=(nn(b.shortLongTermDebtTotal)||0)-(nn(b.cashAndCashEquivalentsAtCarryingValue)||0);
      const ebitda=nn(inc2.ebitda)||(( nn(inc2.operatingIncome)||0)+(nn(inc2.depreciationAndAmortization)||0));
      return ebitda?+(nd/ebitda).toFixed(2):null;
    }).reverse();

    // Chart arrays
    const yrs =incA.map(r=>r.fiscalDateEnding?.substring(0,4)||'').reverse();
    const revH=incA.map(r=>nn(r.totalRevenue)).reverse();
    const gmH =incA.map(r=>{const rev=nn(r.totalRevenue),gp=nn(r.grossProfit);return(rev&&gp&&rev>0)?+((gp/rev)*100).toFixed(2):null;}).reverse();
    const omH =incA.map(r=>{const rev=nn(r.totalRevenue),op=nn(r.operatingIncome);return(rev&&op&&rev>0)?+((op/rev)*100).toFixed(2):null;}).reverse();
    const nmH =incA.map(r=>{const rev=nn(r.totalRevenue),ni=nn(r.netIncome);return(rev&&ni&&rev>0)?+((ni/rev)*100).toFixed(2):null;}).reverse();
    // PE history: AV free doesn't give historical PE, fill with current for now
    const peH =yrs.map(()=>pe);

    // Use 52W high as "ATH" (AV free doesn't give all-time high)
    const displayPrice = ath52 ? ath52*0.92 : null; // rough current approx if no quote
    const actualPrice  = nn(ov['50DayMovingAverage']); // best available proxy

    const R=calcRatings({gm,roe,roic,de:de2,cr,pe,ev,rev5});

    CD={yrs,revH,peH,gmH,omH,nmH,ndH,price:actualPrice,ath:ath52,dcf,ticker,ov};

    const rd={ticker,ov,incA,balA,cfA,R,gm,om,nm,de:de2,cr,rev5,dcf,pe,fwdPE,pb,ps,ev,eps,roe,beta,divYield,mktCap,ath52,analystTarget,curPrice:actualPrice};

    setStatus('✓ Analyse abgeschlossen — '+ov.Name,'ok');
    render(rd,'results');
    addH({ticker,companyName:ov.Name,timestamp:new Date().toISOString(),rating:R.tot,price:actualPrice,industry:ov.Industry||'',rd,cd:CD});

  }catch(e){
    setStatus('Fehler: '+e.message,'error');
    console.error(e);
  }
  document.getElementById('sbtn').disabled=false;
}

function delay(ms){return new Promise(r=>setTimeout(r,ms));}

function renderH(){
  const h=getH(),el=document.getElementById('hlist'),de=lang==='de';
  if(!h.length){el.innerHTML=`<div class="hempty">${de?'— Noch keine Analysen gespeichert —':'— No analyses saved yet —'}</div>`;return;}
  el.innerHTML=`<div class="hlist">${h.map(item=>{
    const ds=new Date(item.timestamp).toLocaleString(de?'de-DE':'en-US',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const rc=item.rating>=7?'hi':item.rating>=5?'mi':'lo';
    return`<div class="hi2" onclick="openItem('${item.ticker}')">
      <div style="flex:1">
        <div class="htk">${item.ticker}</div>
        <div class="hco">${item.companyName||''}</div>
        <div class="hm">${item.industry||''} · ${ds}</div>
        <div class="hm" style="margin-top:0.2rem">${de?'50T-MA':'50D-MA'}: ${item.price?'$'+Number(item.price).toFixed(2):'N/A'}</div>
      </div>
      <div class="hact">
        <span class="badge ${rc}" style="font-size:1rem;padding:0.28rem 0.65rem">${item.rating}/10</span>
        <button class="bsm view" onclick="event.stopPropagation();openItem('${item.ticker}')">${de?'Anzeigen':'View'}</button>
        <button class="bsm del" onclick="event.stopPropagation();delH('${item.ticker}')">${de?'Löschen':'Delete'}</button>
      </div>
    </div>`;}).join('')}</div>`;
}

function openItem(ticker){
  const item=getH().find(e=>e.ticker===ticker);
  if(!item?.rd)return;
  document.getElementById('ovt').textContent=`${ticker} — ${new Date(item.timestamp).toLocaleDateString()}`;
  document.getElementById('ovc').innerHTML='<div id="ov-inner"></div>';
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow='hidden';
  CD=item.cd;
  render(item.rd,'ov-inner');
}
function closeOv(){document.getElementById('overlay').classList.remove('on');document.body.style.overflow='';}

document.getElementById('ticker-input').addEventListener('keydown',e=>{if(e.key==='Enter')startAnalysis();});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeOv();});
