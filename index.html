<!DOCTYPE html>
<html lang="de" data-theme="dark" data-lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua Hust · Analyseprogramm</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--mono:'Courier New',Courier,monospace;--sans:'Segoe UI',system-ui,-apple-system,sans-serif;--radius:8px;--tr:0.18s ease;}
[data-theme="dark"]{--bg:#0d0f12;--sf:#151820;--sf2:#1c2030;--bd:#252a38;--ac:#4fffb0;--ac2:#38b2ff;--dg:#ff4f6a;--wn:#ffc93c;--tx:#e8eaf0;--txd:#6b7590;--txm:#9ba3be;--tabbg:#1c2030;--tabac:#151820;--inbg:#0d0f12;--sh:0 2px 16px rgba(0,0,0,0.4);}
[data-theme="light"]{--bg:#f4f6fb;--sf:#fff;--sf2:#eef1f8;--bd:#dde2ee;--ac:#0a7c4e;--ac2:#1565c0;--dg:#c62828;--wn:#b45309;--tx:#111827;--txd:#9ba3be;--txm:#4a5270;--tabbg:#eef1f8;--tabac:#fff;--inbg:#fff;--sh:0 2px 16px rgba(0,0,0,0.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;transition:background var(--tr),color var(--tr);}

/* HEADER */
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--sh);}
.logo{font-family:var(--mono);font-size:0.95rem;font-weight:700;color:var(--ac);letter-spacing:0.04em;}
.logo span{color:var(--txm);font-weight:400;}
.hc{display:flex;gap:0.6rem;}
.tbtn{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:0.28rem 0.8rem;font-size:0.76rem;font-family:var(--mono);color:var(--txm);cursor:pointer;transition:all var(--tr);}
.tbtn:hover{border-color:var(--ac);color:var(--ac);}

/* TABS */
.tabs{display:flex;background:var(--tabbg);border-bottom:1px solid var(--bd);padding:0 2rem;}
.tab{padding:0.8rem 1.4rem;font-size:0.84rem;font-weight:600;cursor:pointer;color:var(--txd);border-bottom:2px solid transparent;transition:all var(--tr);user-select:none;}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--ac);border-bottom-color:var(--ac);background:var(--tabac);}

/* PANELS */
.panel{display:none;padding:2rem;max-width:1120px;margin:0 auto;}
.panel.active{display:block;}

/* SEARCH */
.scard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.5rem 2rem;margin-bottom:1.5rem;box-shadow:var(--sh);}
.slabel{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.6rem;}
.srow{display:flex;gap:0.7rem;align-items:center;flex-wrap:wrap;}
#ticker-input{font-family:var(--mono);font-size:1.3rem;font-weight:700;background:var(--inbg);border:1.5px solid var(--bd);border-radius:var(--radius);color:var(--tx);padding:0.55rem 1rem;width:200px;letter-spacing:0.14em;text-transform:uppercase;outline:none;transition:border-color var(--tr);}
#ticker-input:focus{border-color:var(--ac);}
#ticker-input::placeholder{color:var(--txd);font-weight:400;letter-spacing:0.04em;font-size:1rem;}
.sbtn{background:var(--ac);color:#0d0f12;border:none;border-radius:var(--radius);padding:0.6rem 1.5rem;font-size:0.86rem;font-weight:700;font-family:var(--mono);letter-spacing:0.06em;cursor:pointer;transition:opacity var(--tr);}
.sbtn:hover{opacity:0.85;}
.sbtn:disabled{opacity:0.35;cursor:not-allowed;}
.status{font-family:var(--mono);font-size:0.76rem;margin-top:0.55rem;min-height:1.1rem;display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;}
.status.loading{color:var(--ac2);}
.status.error{color:var(--dg);}
.status.ok{color:var(--ac);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}

/* COMPANY HEADER */
.cohead{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.2rem 1.6rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;box-shadow:var(--sh);}
.coname{font-size:1.45rem;font-weight:700;line-height:1.2;}
.cometa{font-family:var(--mono);font-size:0.76rem;color:var(--txd);margin-top:0.25rem;}
.codesc{font-size:0.82rem;color:var(--txm);margin-top:0.5rem;max-width:540px;line-height:1.6;}
.coright{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:0.3rem;}
.pval{font-family:var(--mono);font-size:1.8rem;font-weight:700;color:var(--ac);}
.pchg{font-family:var(--mono);font-size:0.82rem;}
.pos{color:#4fffb0;}.neg{color:var(--dg);}

/* STAR */
.star-btn{background:none;border:none;cursor:pointer;font-size:1.6rem;line-height:1;padding:0;transition:transform 0.15s;color:var(--wn);}
.star-btn:hover{transform:scale(1.2);}

/* ACCORDION */
.acc-section{margin-bottom:0.6rem;}
.acc-btn{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:0.85rem 1.2rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:0.88rem;font-weight:600;color:var(--tx);transition:all var(--tr);box-shadow:var(--sh);}
.acc-btn:hover{border-color:var(--ac);color:var(--ac);}
.acc-btn.open{border-color:var(--ac);color:var(--ac);border-bottom-left-radius:0;border-bottom-right-radius:0;}
.acc-arrow{font-size:0.75rem;transition:transform 0.2s;color:var(--txd);}
.acc-btn.open .acc-arrow{transform:rotate(180deg);}
.acc-body{display:none;background:var(--sf);border:1px solid var(--ac);border-top:none;border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);padding:1.2rem;}
.acc-body.open{display:block;}

/* CHART SUB-ACCORDION */
.chart-acc{margin-top:0.5rem;}
.chart-acc-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:0.55rem 1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:0.8rem;font-family:var(--mono);color:var(--txm);transition:all var(--tr);width:100%;margin-bottom:0.4rem;}
.chart-acc-btn:hover{border-color:var(--ac2);color:var(--ac2);}
.chart-acc-btn.open{border-color:var(--ac2);color:var(--ac2);}
.chart-acc-body{display:none;padding:1rem 0 0.5rem;}
.chart-acc-body.open{display:block;}
.cwrap{position:relative;height:240px;}
.dcfwrap{position:relative;height:320px;}

/* METRICS */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0.7rem;}
.mcard{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:0.8rem 0.9rem;}
.mlabel{font-family:var(--mono);font-size:0.65rem;color:var(--txd);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:0.28rem;}
.mval{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--tx);}
.mval.a{color:var(--ac);}.mval.b{color:var(--ac2);}

/* TABLE */
.twrap{overflow:hidden;border-radius:6px;border:1px solid var(--bd);}
table{width:100%;border-collapse:collapse;}
th{background:var(--sf2);color:var(--txd);font-family:var(--mono);font-size:0.69rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.6rem 0.9rem;text-align:left;border-bottom:1px solid var(--bd);}
td{padding:0.7rem 0.9rem;border-bottom:1px solid var(--bd);font-size:0.84rem;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--sf2);}
tr.sumrow td{background:var(--sf2);font-weight:700;border-top:2px solid var(--bd);}
.badge{display:inline-block;font-family:var(--mono);font-weight:700;font-size:0.82rem;padding:0.13rem 0.45rem;border-radius:4px;white-space:nowrap;border:1px solid;}
.badge.hi{color:#4fffb0;border-color:#4fffb0;background:rgba(79,255,176,0.07);}
.badge.mi{color:#ffc93c;border-color:#ffc93c;background:rgba(255,201,60,0.07);}
.badge.lo{color:var(--dg);border-color:var(--dg);background:rgba(255,79,106,0.07);}
.badge.tot{color:var(--ac2);border-color:var(--ac2);background:rgba(56,178,255,0.10);font-size:0.92rem;}

/* DISCLAIMER */
.disclaimer{font-size:0.7rem;color:var(--txd);border-top:1px solid var(--bd);padding-top:1rem;margin-top:1rem;line-height:1.65;font-family:var(--mono);}

/* FAVORITES */
.fav-empty{text-align:center;padding:3rem;color:var(--txd);font-family:var(--mono);font-size:0.84rem;}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0.8rem;}
.fav-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.1rem 1.3rem;box-shadow:var(--sh);cursor:pointer;transition:border-color var(--tr),transform 0.15s;}
.fav-card:hover{border-color:var(--ac);transform:translateY(-2px);}
.fav-ticker{font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--ac);}
.fav-name{font-size:0.88rem;color:var(--txm);margin:0.15rem 0;}
.fav-meta{font-family:var(--mono);font-size:0.7rem;color:var(--txd);}
.fav-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.6rem;}
.fav-del{font-family:var(--mono);font-size:0.7rem;padding:0.18rem 0.55rem;border-radius:4px;cursor:pointer;border:1px solid var(--bd);background:none;color:var(--txd);transition:all var(--tr);}
.fav-del:hover{color:var(--dg);border-color:var(--dg);}

/* DETAIL VIEW (full page) */
#detail-view{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;}
#detail-view.on{display:block;}
.detail-topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 2rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:var(--sh);}
.detail-title{font-family:var(--mono);font-size:0.82rem;color:var(--txd);letter-spacing:0.08em;}
.detail-close{font-family:var(--mono);background:none;border:1px solid var(--bd);color:var(--txm);border-radius:6px;padding:0.28rem 0.85rem;cursor:pointer;font-size:0.8rem;transition:all var(--tr);}
.detail-close:hover{border-color:var(--dg);color:var(--dg);}
.detail-content{padding:2rem;max-width:1120px;margin:0 auto;}

@media(max-width:680px){.panel{padding:1rem;}.detail-content{padding:1rem;}header{padding:0 1rem;}.tabs{padding:0 1rem;}.fav-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header>
  <div class="logo">Joshua Hust<span> · Analyseprogramm</span></div>
  <div class="hc">
    <button class="tbtn" id="lang-btn" onclick="toggleLang()">EN</button>
    <button class="tbtn" id="theme-btn" onclick="toggleTheme()">☀ LIGHT</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-analyse" onclick="switchTab('analyse')" data-de="Analyse" data-en="Analysis">Analyse</div>
  <div class="tab" id="tab-favs" onclick="switchTab('favs')" data-de="Favoriten" data-en="Favorites">Favoriten</div>
</div>

<div class="panel active" id="panel-analyse">
  <div class="scard">
    <div class="slabel" data-de="Ticker-Symbol eingeben" data-en="Enter ticker symbol">Ticker-Symbol eingeben</div>
    <div class="srow">
      <input type="text" id="ticker-input" placeholder="z.B. AAPL" autocomplete="off" spellcheck="false">
      <button class="sbtn" id="sbtn" onclick="startAnalysis()" data-de="Analysieren" data-en="Analyse">Analysieren</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div id="results"></div>
</div>

<div class="panel" id="panel-favs">
  <div id="favs-list"></div>
</div>

<!-- FULL-PAGE DETAIL VIEW -->
<div id="detail-view">
  <div class="detail-topbar">
    <div class="detail-title" id="detail-title">FAVORIT</div>
    <button class="detail-close" onclick="closeDetail()">✕ <span data-de="Schließen" data-en="Close">Schließen</span></button>
  </div>
  <div class="detail-content" id="detail-content"></div>
</div>

<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════
const FH_KEY = 'd9jr0g1r01qr77bnrgh0d9jr0g1r01qr77bnrghg';
const FH     = 'https://finnhub.io/api/v1';
let lang='de', theme='dark';
let currentRenderData=null, currentChartData=null;

// ════════════════════════════════════════
// THEME / LANG
// ════════════════════════════════════════
function toggleTheme(){
  theme=theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('theme-btn').textContent=theme==='dark'?'☀ LIGHT':'☾ DARK';
  reRenderCharts();
}
function toggleLang(){
  lang=lang==='de'?'en':'de';
  document.documentElement.setAttribute('data-lang',lang);
  document.getElementById('lang-btn').textContent=lang==='de'?'EN':'DE';
  document.querySelectorAll('[data-de]').forEach(el=>{
    if(el.tagName!=='INPUT'&&el.tagName!=='BUTTON'||el.classList.contains('tbtn')||el.classList.contains('sbtn'))
      el.textContent=lang==='de'?el.getAttribute('data-de'):el.getAttribute('data-en');
  });
}

// ════════════════════════════════════════
// TABS
// ════════════════════════════════════════
function switchTab(n){
  ['analyse','favs'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===n);
    document.getElementById('panel-'+t).classList.toggle('active',t===n);
  });
  if(n==='favs') renderFavs();
}

// ════════════════════════════════════════
// STORAGE — ONLY FAVORITES (no history)
// ════════════════════════════════════════
function getFavs(){try{return JSON.parse(localStorage.getItem('fa_favs')||'[]');}catch{return[];}}
function saveFavs(a){localStorage.setItem('fa_favs',JSON.stringify(a));}
function isFav(ticker){return getFavs().some(f=>f.ticker===ticker);}
function addFav(entry){
  let favs=getFavs().filter(f=>f.ticker!==entry.ticker);
  favs.unshift(entry);saveFavs(favs);
}
function removeFav(ticker){saveFavs(getFavs().filter(f=>f.ticker!==ticker));}
function toggleFav(ticker){
  if(isFav(ticker)){
    removeFav(ticker);
    updateStar(ticker,false);
  } else {
    if(currentRenderData&&currentRenderData.ticker===ticker){
      addFav({
        ticker,
        companyName:currentRenderData.p?.name||ticker,
        industry:currentRenderData.p?.finnhubIndustry||'',
        price:currentRenderData.price,
        rating:currentRenderData.R?.tot||null,
        timestamp:new Date().toISOString(),
        rd:currentRenderData,
        cd:currentChartData
      });
    }
    updateStar(ticker,true);
  }
}
function updateStar(ticker,filled){
  document.querySelectorAll('.star-btn[data-ticker="'+ticker+'"]').forEach(b=>{
    b.textContent=filled?'★':'☆';
    b.title=filled?(lang==='de'?'Aus Favoriten entfernen':'Remove from favorites'):(lang==='de'?'Zu Favoriten hinzufügen':'Add to favorites');
  });
}

// ════════════════════════════════════════
// STATUS
// ════════════════════════════════════════
function setStatus(msg,type=''){
  const el=document.getElementById('status');
  el.className='status '+type;
  el.innerHTML=type==='loading'?`<span class="spin"></span>${msg}`:msg;
}

// ════════════════════════════════════════
// FETCH
// ════════════════════════════════════════
async function fh(path,params={}){
  const p=new URLSearchParams({...params,token:FH_KEY});
  const r=await fetch(`${FH}${path}?${p}`);
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  return r.json();
}
async function fhS(path,params={}){try{return await fh(path,params);}catch(e){console.warn(path,e.message);return null;}}

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function n(v){const x=parseFloat(v);return isNaN(x)||!isFinite(x)?null:x;}
function nf(v,d=2,s=''){const x=n(v);return x===null?null:x.toFixed(d)+s;}
function fmtB(v){
  const x=n(v);if(x===null)return null;
  if(Math.abs(x)>=1e12)return(x/1e12).toFixed(2)+' T';
  if(Math.abs(x)>=1e9)return(x/1e9).toFixed(2)+' B';
  if(Math.abs(x)>=1e6)return(x/1e6).toFixed(2)+' M';
  return x.toLocaleString();
}
function isDE(ticker){return ticker.endsWith('.DE')||ticker.endsWith('.F')||ticker.endsWith('.XETRA');}

// ════════════════════════════════════════
// FIND VALUE IN SEC REPORT ITEMS
// ════════════════════════════════════════
function findVal(items,...keys){
  if(!Array.isArray(items)||!items.length)return null;
  for(const key of keys){
    const kl=key.toLowerCase();
    const found=items.find(x=>{
      const lbl=(x.label||x.concept||'').toLowerCase();
      return lbl.includes(kl);
    });
    if(found){const v=n(found.value);if(v!==null)return v;}
  }
  return null;
}
function parseReports(data){
  if(!data||!data.data)return[];
  return data.data.filter(r=>r.form==='10-K').slice(0,5);
}

// ════════════════════════════════════════
// RATINGS (only for dimensions with data)
// ════════════════════════════════════════
function computeRatings(d){
  function sc(v,g,ok,b,inv=false){if(v===null||isNaN(v))return null;if(!inv)return v>=g?9:v>=ok?6:v>=b?3:2;return v<=g?9:v<=ok?6:v<=b?3:2;}
  function cl(v){return v===null?null:Math.max(1,Math.min(10,Math.round(v)));}

  const scores=[];
  const labels_de=[];
  const labels_en=[];
  const notes_de=[];
  const notes_en=[];

  // 1. Geschäftsmodell & Wettbewerbsposition
  const s1gm=sc(d.gm,0.5,0.3,0.15);
  const s1r=sc(d.rev5,0.15,0.07,0.02);
  if(s1gm!==null||s1r!==null){
    const r=cl(((s1gm||5)+(s1r||5))/2);
    scores.push(r);
    labels_de.push('Geschäftsmodell & Wettbewerbsposition');
    labels_en.push('Business Model & Competitive Position');
    notes_de.push(d.gm?`Bruttomarge ${(d.gm*100).toFixed(1)}% — ${d.gm>0.4?'starkes Preissetzungsvermögen':d.gm>0.25?'solide Margenstruktur':'schwache Margenstruktur'}`:(d.rev5?`Umsatz-CAGR ${(d.rev5*100).toFixed(1)}%`:''));
    notes_en.push(d.gm?`Gross margin ${(d.gm*100).toFixed(1)}% — ${d.gm>0.4?'strong pricing power':d.gm>0.25?'solid margin structure':'weak margin structure'}`:(d.rev5?`Revenue CAGR ${(d.rev5*100).toFixed(1)}%`:''));
  }

  // 2. Finanzkennzahlen
  const s2vals=[sc(d.rev5,0.15,0.07,0.02),sc(d.roe,0.2,0.12,0.06),sc(d.roic,0.15,0.09,0.04),sc(d.de,0.5,1.5,3,true)].filter(v=>v!==null);
  if(s2vals.length){
    const r=cl(s2vals.reduce((a,b)=>a+b,0)/s2vals.length);
    scores.push(r);
    labels_de.push('Finanzkennzahlen');
    labels_en.push('Financial Metrics');
    notes_de.push(d.roe?`ROE ${(d.roe*100).toFixed(1)}%${d.roic?', ROIC '+(d.roic*100).toFixed(1)+'%':''} — ${d.roe>0.15?'gute Kapitalrendite':'moderate Kapitalrendite'}`:(d.rev5?`Umsatz-CAGR ${(d.rev5*100).toFixed(1)}%`:''));
    notes_en.push(d.roe?`ROE ${(d.roe*100).toFixed(1)}%${d.roic?', ROIC '+(d.roic*100).toFixed(1)+'%':''} — ${d.roe>0.15?'strong capital returns':'moderate capital returns'}`:(d.rev5?`Revenue CAGR ${(d.rev5*100).toFixed(1)}%`:''));
  }

  // 3. Bewertung
  let vs=null;
  if(d.pe!==null&&!isNaN(d.pe))vs=d.pe<12?9:d.pe<18?7:d.pe<28?5:d.pe<40?3:2;
  const v2=d.ev!==null?(d.ev<10?9:d.ev<18?6:d.ev<30?4:2):null;
  const s3vals=[vs,v2].filter(v=>v!==null);
  if(s3vals.length){
    const r=cl(s3vals.reduce((a,b)=>a+b,0)/s3vals.length);
    scores.push(r);
    labels_de.push('Bewertung');
    labels_en.push('Valuation');
    notes_de.push(d.pe?`KGV ${Number(d.pe).toFixed(1)}${d.ev?' / EV/EBITDA '+Number(d.ev).toFixed(1)+'x':''} — ${d.pe<18?'attraktiv':d.pe<30?'fair':'Premium'}`:'');
    notes_en.push(d.pe?`P/E ${Number(d.pe).toFixed(1)}${d.ev?' / EV/EBITDA '+Number(d.ev).toFixed(1)+'x':''} — ${d.pe<18?'attractive':d.pe<30?'fair':'premium'}`:'');
  }

  // 4. Kapitalallokation (ROIC als Proxy)
  if(d.roic!==null){
    const r=cl(sc(d.roic,0.18,0.10,0.05));
    scores.push(r);
    labels_de.push('Management & Kapitalallokation');
    labels_en.push('Management & Capital Allocation');
    notes_de.push(`ROIC ${(d.roic*100).toFixed(1)}% — ${d.roic>0.12?'gute Kapitalallokation erkennbar':'moderate Kapitalallokation'}`);
    notes_en.push(`ROIC ${(d.roic*100).toFixed(1)}% — ${d.roic>0.12?'good capital allocation visible':'moderate capital allocation'}`);
  }

  // 5. Wachstumspotenzial
  if(d.rev5!==null){
    const r=cl(sc(d.rev5,0.2,0.1,0.03));
    scores.push(r);
    labels_de.push('Wachstumspotenzial');
    labels_en.push('Growth Potential');
    notes_de.push(`Umsatz-CAGR 5J: ${(d.rev5*100).toFixed(1)}% — ${d.rev5>0.1?'starkes Wachstum als Katalysator':'moderates Wachstumspotenzial'}`);
    notes_en.push(`Revenue CAGR 5Y: ${(d.rev5*100).toFixed(1)}% — ${d.rev5>0.1?'strong organic growth catalyst':'moderate growth potential'}`);
  }

  const tot=scores.length?cl(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  return{scores,tot,labels_de,labels_en,notes_de,notes_en};
}

// ════════════════════════════════════════
// DCF — mit Beta-basiertem WACC
// ════════════════════════════════════════
function dcfEst(fcfArr,shares,beta){
  try{
    const vals=fcfArr.filter(v=>v!==null&&v>0);
    if(!vals.length||!shares||shares<=0)return null;
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    // WACC: risikofreier Zins 4% + Beta * Risikoprämie 5.5%
    const rf=0.04, rm=0.055;
    const betaV=n(beta)||1.0;
    const wacc=rf+betaV*rm;
    const g=0.025; // konservatives ewiges Wachstum
    const N=5;
    // FCF-Wachstum aus den letzten Jahren schätzen
    const fcfGrowth=vals.length>=2?Math.max(-0.05,Math.min(0.20,Math.pow(vals[0]/vals[vals.length-1],1/(vals.length-1))-1)):0.05;
    let pv=0;
    for(let i=1;i<=N;i++)pv+=(avg*Math.pow(1+fcfGrowth,i))/Math.pow(1+wacc,i);
    const tv=(avg*Math.pow(1+fcfGrowth,N)*(1+g))/((wacc-g)*Math.pow(1+wacc,N));
    return{fairValue:(pv+tv)/shares,wacc,fcfGrowth,g,beta:betaV};
  }catch{return null;}
}

    plugins:{legend:{labels:{color:c.t,font:{family:"'Courier New',monospace",size:11}}},tooltip:{mode:'index',intersect:false}},
    scales:{x:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}},y:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}}}};

  if(id==='chart-pe'){
    charts[id]=new Chart(el,{type:'line',data:{labels:cd.yrs,datasets:[{
      label:de?'KGV (Jahresschlusskurs ÷ EPS)':'P/E (year-end price ÷ EPS)',
      data:cd.peH,borderColor:c.a,backgroundColor:c.a+'18',borderWidth:2,
      pointBackgroundColor:c.a,pointRadius:4,fill:true,tension:0.3,spanGaps:false
    }]},options:{...base}});
  }
  if(id==='chart-mg'){
    charts[id]=new Chart(el,{type:'line',data:{labels:cd.yrs,datasets:[
      {label:de?'Bruttomarge %':'Gross %',data:cd.gmH,borderColor:c.a,borderWidth:2,pointRadius:4,tension:0.3,fill:false,spanGaps:true},
      {label:de?'Op. Marge %':'Op. %',data:cd.omH,borderColor:c.b,borderWidth:2,pointRadius:4,tension:0.3,fill:false,spanGaps:true},
      {label:de?'Nettomarge %':'Net %',data:cd.nmH,borderColor:c.w,borderWidth:2,pointRadius:4,tension:0.3,fill:false,spanGaps:true}
    ]},options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v!=null?v.toFixed(1)+'%':null}}}}});
  }
  if(id==='chart-rv'){
    charts[id]=new Chart(el,{type:'bar',data:{labels:cd.yrs,datasets:[
      {label:de?'Umsatz (Mrd.)':'Revenue (B)',data:cd.revH.map(v=>v!=null?(v/1e9).toFixed(2):null),backgroundColor:c.a+'55',borderColor:c.a,borderWidth:1,yAxisID:'y'},
      {label:'Net Debt/EBITDA',data:cd.ndH,type:'line',borderColor:c.d,backgroundColor:'transparent',borderWidth:2,pointRadius:4,yAxisID:'y1',tension:0.3,spanGaps:true}
    ]},options:{...base,scales:{x:base.scales.x,
      y:{...base.scales.y,position:'left',title:{display:true,text:de?'Mrd. USD':'B USD',color:c.t,font:{size:10}}},
      y1:{...base.scales.y,position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'ND/EBITDA',color:c.d,font:{size:10}}}
    }}});
  }
  if(id==='chart-dcf'&&cd.price){
    const cp=cd.price,ath=cd.ath||cp*1.4,dcfVal=cd.dcfResult?.fairValue||null;
    const maxY=Math.max(cp,ath,dcfVal||0)*1.25;
    charts[id]=new Chart(el,{
      type:'bar',
      data:{labels:[cd.ticker],datasets:[{data:[maxY],backgroundColor:c.a+'10',borderColor:c.bd,borderWidth:1}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},
        scales:{x:{grid:{color:c.g},ticks:{color:c.t}},y:{min:0,max:maxY,grid:{color:c.g},ticks:{color:c.t,callback:v=>'$'+v.toFixed(0)}}}},
      plugins:[{id:'dcfL',afterDraw(chart){
        const{ctx,chartArea,scales}=chart;if(!chartArea)return;
        const yS=scales.y,x0=chartArea.left,x1=chartArea.right;
        function line(val,color,label,offY=0){
          if(val==null||isNaN(val))return;
          const y=yS.getPixelForValue(val);
          ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
          ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
          ctx.setLineDash([]);ctx.fillStyle=color;
          ctx.font='bold 11px Courier New,monospace';ctx.textAlign='left';
          ctx.fillText(label+': $'+Number(val).toFixed(2),x0+8,y-6+offY);ctx.restore();
        }
        const athY=yS.getPixelForValue(ath),cpY=yS.getPixelForValue(cp);
        line(ath,c.b,de?'52W-Hoch':'52W-High',0);
        line(cp,c.a,de?'Aktueller Kurs':'Current Price',Math.abs(athY-cpY)<22?14:0);
        if(dcfVal){
          const dcfY=yS.getPixelForValue(dcfVal);
          line(dcfVal,c.w,de?'Fairer Wert (DCF)':'DCF Fair Value',Math.abs(cpY-dcfY)<22?14:0);
        }
        // DCF Annahmen
        if(cd.dcfResult){
          const dr=cd.dcfResult;
          ctx.save();ctx.fillStyle=c.t;ctx.font='10px Courier New,monospace';ctx.textAlign='right';
          ctx.fillText(`WACC: ${(dr.wacc*100).toFixed(1)}% · FCF-g: ${(dr.fcfGrowth*100).toFixed(1)}% · β: ${dr.beta.toFixed(2)}`,x1-8,chartArea.bottom-8);
          ctx.restore();
        }
      }}]
    });
  }
}

// MAIN ANALYSIS
// ════════════════════════════════════════
async function startAnalysis(){
  const ticker=document.getElementById('ticker-input').value.trim().toUpperCase();
  if(!ticker){setStatus(lang==='de'?'Bitte einen Ticker eingeben.':'Please enter a ticker.','error');return;}
  document.getElementById('sbtn').disabled=true;
  document.getElementById('results').innerHTML='';
  killCharts();currentRenderData=null;currentChartData=null;

  try{
    const isGerman=isDE(ticker);
    setStatus((lang==='de'?'Lade Kurs & Profil…':'Loading price & profile…'),'loading');

    const [quote,profile,metrics]=await Promise.all([
      fh('/quote',{symbol:ticker}),
      fhS('/stock/profile2',{symbol:ticker}),
      fhS('/stock/metric',{symbol:ticker,metric:'all'})
    ]);

    if(!quote||(!quote.c&&!quote.pc)){
      setStatus(lang==='de'?`Ticker „${ticker}" nicht gefunden.`:`Ticker "${ticker}" not found.`,'error');
      document.getElementById('sbtn').disabled=false;return;
    }

    const m=metrics?.metric||{};
    const p=profile||{};
    const price=n(quote.c);
    const change=n(quote.d)||0;
    const chgPct=n(quote.dp)||0;
    const high52=n(m['52WeekHigh'])||n(quote.h);
    const low52=n(m['52WeekLow'])||n(quote.l);
    const pe=n(m.peBasicExclExtraTTM)||n(m.peTTM)||null;
    const pb=n(m.pbQuarterly)||n(m.pbAnnual)||null;
    const ps=n(m.psTTM)||null;
    const ev=n(m.evEbitdaTTM)||null;
    const roe=n(m.roeTTM)!==null?n(m.roeTTM)/100:null;
    const roic=n(m.roicTTM)!==null?n(m.roicTTM)/100:(n(m.roic)!==null?n(m.roic)/100:null);
    const gm=n(m.grossMarginTTM)!==null?n(m.grossMarginTTM)/100:(n(m.grossMarginAnnual)!==null?n(m.grossMarginAnnual)/100:null);
    const om=n(m.operatingMarginTTM)!==null?n(m.operatingMarginTTM)/100:null;
    const nm=n(m.netProfitMarginTTM)!==null?n(m.netProfitMarginTTM)/100:(n(m.netMarginTTM)!==null?n(m.netMarginTTM)/100:null);
    const de2=n(m.totalDebt_totalEquityAnnual)||null;
    const cr=n(m.currentRatioAnnual)||n(m.currentRatioQuarterly)||null;
    const eps=n(m.epsBasicExclExtraItemsTTM)||n(m.epsTTM)||null;
    const beta=n(m.beta)||null;
    const divY=n(m.dividendYieldIndicatedAnnual)||null;
    const mktCap=n(p.marketCapitalization)?n(p.marketCapitalization)*1e6:null;
    const sharesOut=n(m.sharesOutstanding)?n(m.sharesOutstanding)*1e6:(n(p.shareOutstanding)?n(p.shareOutstanding)*1e6:null);

    // Für US-Ticker: historische Daten aus SEC
    let yrs=[],revH=[],gmH=[],omH=[],nmH=[],ndH=[],peH=[],fcfArr=[];
    let rev5=null,dcfResult=null;

    if(!isGerman){
      setStatus(lang==='de'?'Lade Jahresabschlüsse (SEC)…':'Loading annual reports (SEC)…','loading');
      const reported=await fhS('/stock/financials-reported',{symbol:ticker,freq:'annual'});
      const reports=parseReports(reported);

      for(const rep of reports){
        const year=rep.startDate?.substring(0,4)||rep.endDate?.substring(0,4)||'';
        if(year)yrs.unshift(year);
        const ic=rep.report?.ic||[];
        const bs=rep.report?.bs||[];
        const cf=rep.report?.cf||[];
        const rev=findVal(ic,'Revenues','Revenue','Net revenue','Total revenue','Sales');
        const gp=findVal(ic,'Gross profit','Gross margin');
        const oi=findVal(ic,'Operating income','Operating profit','Income from operations');
        const ni=findVal(ic,'Net income','Net earnings','Net loss');
        const ltd=findVal(bs,'Long-term debt','LongTermDebt');
        const std=findVal(bs,'Short-term debt','ShortTermDebt','Current portion');
        const cash=findVal(bs,'Cash and cash equivalents','CashAndCashEquivalents');
        const ebitda=findVal(ic,'EBITDA')||(oi!==null&&findVal(ic,'Depreciation')!==null?oi+findVal(ic,'Depreciation'):null);
        const opcf=findVal(cf,'Net cash from operating','Cash from operations','Operating activities');
        const capex=findVal(cf,'Capital expenditures','Payments for property','Purchase of property');
        revH.unshift(rev);
        gmH.unshift(rev&&gp?+(gp/rev*100).toFixed(2):null);
        omH.unshift(rev&&oi?+(oi/rev*100).toFixed(2):null);
        nmH.unshift(rev&&ni?+(ni/rev*100).toFixed(2):null);
        const td=(ltd||0)+(std||0);
        ndH.unshift(td&&cash!=null&&ebitda&&ebitda>0?+((td-cash)/ebitda).toFixed(2):null);
        fcfArr.unshift(opcf!==null&&capex!==null?opcf-Math.abs(capex):null);
      }

      // Revenue CAGR
      const rv=revH.filter(v=>v!==null);
      if(rv.length>=2&&rv[0]>0)rev5=Math.pow(rv[rv.length-1]/rv[0],1/(rv.length-1))-1;

      // KGV-Verlauf: Jahresschlusskurs laden
      setStatus(lang==='de'?'Lade historische Kurse für KGV…':'Loading historical prices for P/E…','loading');
      const now=Math.floor(Date.now()/1000);
      for(let i=0;i<yrs.length;i++){
        const yr=parseInt(yrs[i]);
        if(isNaN(yr)){peH.push(null);continue;}
        const from=Math.floor(new Date(yr,11,28)/1000);
        const to=Math.floor(new Date(yr,11,31,23,59)/1000);
        const candle=await fhS('/stock/candle',{symbol:ticker,resolution:'D',from,to});
        const closePrice=candle?.c?.length?candle.c[candle.c.length-1]:null;
        const epsYear=eps; // Näherung: aktuelles EPS (historisches EPS wäre Premium)
        peH.push(closePrice&&epsYear&&epsYear>0?+(closePrice/epsYear).toFixed(1):null);
      }

      // DCF
      dcfResult=dcfEst(fcfArr,sharesOut,beta);
    }

    const R=computeRatings({gm,roe,roic,de:de2,pe,ev,rev5});
    const rd={ticker,p,quote,m,R,price,high52,low52,mktCap,pe,ev,pb,ps,roe,roic,gm,om,nm,de:de2,cr,eps,rev5,dcfResult,beta,divY,change,chgPct,sharesOut,isGerman};
    currentRenderData=rd;
    currentChartData=yrs.length?{yrs,revH,gmH,omH,nmH,peH,ndH,price,ath:high52,dcfResult,ticker}:null;

    setStatus('✓ '+(lang==='de'?'Analyse abgeschlossen':'Analysis complete')+' — '+(p.name||ticker),'ok');
    renderResults(rd,'results');

  }catch(e){
    setStatus('Fehler: '+e.message,'error');console.error(e);
  }
  document.getElementById('sbtn').disabled=false;
}

      chartBtns.push(makeChartAcc('chart-rv',de?'📦 Umsatz & Net Debt/EBITDA':'📦 Revenue & Net Debt/EBITDA'));
    if(cd.price&&(cd.dcfResult||cd.ath))
      chartBtns.push(makeChartAcc('chart-dcf',de?'💹 Kursspanne & DCF-Bewertung':'💹 Price Range & DCF Valuation','dcfwrap'));
    chartsHtml=chartBtns.length?chartBtns.join(''):`<p style="color:var(--txd);font-family:var(--mono);font-size:0.82rem">${de?'Keine historischen Daten verfügbar (nur US-Ticker).':'No historical data available (US tickers only).'}</p>`;
  } else {
    chartsHtml=`<p style="color:var(--txd);font-family:var(--mono);font-size:0.82rem">${de?'Keine Grafiken verfügbar.':'No charts available.'}</p>`;
  }

  const disclaimer=`<div class="disclaimer">${de
    ?'⚠ Keine Anlageberatung. Kursdaten: Finnhub API (Free, 60 Calls/min). Jahresabschlüsse: SEC 10-K Filings. DCF: WACC aus Beta (rf=4%, rm=5.5%), FCF-Wachstum aus Verlauf, ewige Wachstumsrate 2.5%. Nur US-Ticker mit vollständiger Fundamentalanalyse.'
    :'⚠ Not financial advice. Price data: Finnhub API (free, 60 calls/min). Financials: SEC 10-K filings. DCF: WACC from beta (rf=4%, rm=5.5%), FCF growth from history, perpetual growth 2.5%. Full analysis for US tickers only.'
  }</div>`;

  c.innerHTML = headerHtml
    + makeAcc('fin', de?'💰 Finanzdaten':'💰 Financial Data', finHtml, true)
    + makeAcc('tab', de?'📋 Bewertungstabelle':'📋 Rating Table', tableHtml, false)
    + makeAcc('charts', de?'📈 Grafiken':'📈 Charts', chartsHtml, false)
    + disclaimer;
}

// ════════════════════════════════════════
// FAVORITES
// ════════════════════════════════════════
function renderFavs(){
  const favs=getFavs(),el=document.getElementById('favs-list'),de=lang==='de';
  if(!favs.length){
    el.innerHTML=`<div class="fav-empty">${de?'— Noch keine Favoriten gespeichert —\nKlicke beim Analysieren auf den ☆ Stern':'— No favorites saved yet —\nClick the ☆ star while analysing to add one'}</div>`;
    return;
  }
  el.innerHTML=`<div class="fav-grid">${favs.map(f=>{
    const bc=f.rating>=7?'hi':f.rating>=5?'mi':'lo';
    const ds=new Date(f.timestamp).toLocaleDateString(de?'de-DE':'en-US',{day:'2-digit',month:'2-digit',year:'numeric'});
    return`<div class="fav-card" onclick="openFavDetail('${f.ticker}')">
      <div class="fav-ticker">${f.ticker}</div>
      <div class="fav-name">${f.companyName||''}</div>
      <div class="fav-meta">${f.industry||''}</div>
      <div class="fav-meta">${de?'Gespeichert':'Saved'}: ${ds}</div>
      <div class="fav-footer">
        ${f.rating?`<span class="badge ${bc}">${f.rating}/10</span>`:'<span></span>'}
        <button class="fav-del" onclick="event.stopPropagation();removeFavAndRefresh('${f.ticker}')">${de?'✕ Entfernen':'✕ Remove'}</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function removeFavAndRefresh(ticker){removeFav(ticker);renderFavs();}

function openFavDetail(ticker){
  const item=getFavs().find(f=>f.ticker===ticker);
  if(!item?.rd)return;
  document.getElementById('detail-title').textContent=`${ticker} — ${item.companyName||''}`;
  document.getElementById('detail-content').innerHTML='<div id="fav-inner"></div>';
  document.getElementById('detail-view').classList.add('on');
  document.body.style.overflow='hidden';
  currentRenderData=item.rd;
  currentChartData=item.cd||null;
  killCharts();
  renderResults(item.rd,'fav-inner');
}
function closeDetail(){
  document.getElementById('detail-view').classList.remove('on');
  document.body.style.overflow='';
  killCharts();
  currentRenderData=null;currentChartData=null;
}

document.getElementById('ticker-input').addEventListener('keydown',e=>{if(e.key==='Enter')startAnalysis();});
