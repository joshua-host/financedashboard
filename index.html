<!DOCTYPE html>
<html lang="de" data-theme="dark" data-lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FA Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--mono:'Courier New',Courier,monospace;--sans:'Segoe UI',system-ui,-apple-system,sans-serif;--radius:8px;--tr:0.18s ease;}
[data-theme="dark"]{--bg:#0d0f12;--sf:#151820;--sf2:#1c2030;--bd:#252a38;--ac:#4fffb0;--ac2:#38b2ff;--dg:#ff4f6a;--wn:#ffc93c;--tx:#e8eaf0;--txd:#6b7590;--txm:#9ba3be;--tabbg:#1c2030;--tabac:#151820;--inbg:#0d0f12;--sh:0 2px 16px rgba(0,0,0,0.4);}
[data-theme="light"]{--bg:#f4f6fb;--sf:#fff;--sf2:#eef1f8;--bd:#dde2ee;--ac:#0a7c4e;--ac2:#1565c0;--dg:#c62828;--wn:#b45309;--tx:#111827;--txd:#9ba3be;--txm:#4a5270;--tabbg:#eef1f8;--tabac:#fff;--inbg:#fff;--sh:0 2px 16px rgba(0,0,0,0.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;transition:background var(--tr),color var(--tr);}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--sh);}
.logo{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--ac);letter-spacing:0.1em;}
.logo span{color:var(--ac2);}
.hc{display:flex;gap:0.6rem;}
.tbtn{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:0.28rem 0.8rem;font-size:0.76rem;font-family:var(--mono);color:var(--txm);cursor:pointer;transition:all var(--tr);}
.tbtn:hover{border-color:var(--ac);color:var(--ac);}
.tabs{display:flex;background:var(--tabbg);border-bottom:1px solid var(--bd);padding:0 2rem;}
.tab{padding:0.8rem 1.4rem;font-size:0.84rem;font-weight:600;cursor:pointer;color:var(--txd);border-bottom:2px solid transparent;transition:all var(--tr);user-select:none;}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--ac);border-bottom-color:var(--ac);background:var(--tabac);}
.panel{display:none;padding:2rem;max-width:1120px;margin:0 auto;}
.panel.active{display:block;}
.scard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.5rem 2rem;margin-bottom:1.5rem;box-shadow:var(--sh);}
.slabel{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.6rem;}
.srow{display:flex;gap:0.7rem;align-items:center;flex-wrap:wrap;}
#ticker-input{font-family:var(--mono);font-size:1.3rem;font-weight:700;background:var(--inbg);border:1.5px solid var(--bd);border-radius:var(--radius);color:var(--tx);padding:0.55rem 1rem;width:200px;letter-spacing:0.14em;text-transform:uppercase;outline:none;transition:border-color var(--tr);}
#ticker-input:focus{border-color:var(--ac);}
#ticker-input::placeholder{color:var(--txd);font-weight:400;letter-spacing:0.04em;font-size:1rem;}
.sbtn{background:var(--ac);color:#0d0f12;border:none;border-radius:var(--radius);padding:0.6rem 1.5rem;font-size:0.86rem;font-weight:700;font-family:var(--mono);letter-spacing:0.06em;cursor:pointer;transition:opacity var(--tr);}
.sbtn:hover{opacity:0.85;}
.sbtn:disabled{opacity:0.35;cursor:not-allowed;}
.status{font-family:var(--mono);font-size:0.76rem;margin-top:0.55rem;min-height:1.1rem;display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;}
.status.loading{color:var(--ac2);}
.status.error{color:var(--dg);}
.status.ok{color:var(--ac);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
.cohead{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.2rem 1.6rem;margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;box-shadow:var(--sh);}
.coname{font-size:1.45rem;font-weight:700;line-height:1.2;}
.cometa{font-family:var(--mono);font-size:0.76rem;color:var(--txd);margin-top:0.25rem;}
.codesc{font-size:0.82rem;color:var(--txm);margin-top:0.5rem;max-width:540px;line-height:1.6;}
.pval{font-family:var(--mono);font-size:1.8rem;font-weight:700;color:var(--ac);text-align:right;}
.pchg{font-family:var(--mono);font-size:0.82rem;margin-top:0.15rem;text-align:right;}
.pos{color:#4fffb0;}.neg{color:var(--dg);}
.stitle{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.12em;text-transform:uppercase;margin:1.4rem 0 0.7rem;padding-left:2px;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:0.8rem;margin-bottom:0.5rem;}
.mcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:0.85rem 1rem;box-shadow:var(--sh);}
.mlabel{font-family:var(--mono);font-size:0.66rem;color:var(--txd);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:0.28rem;}
.mval{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--tx);}
.mval.a{color:var(--ac);}.mval.b{color:var(--ac2);}
.twrap{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);margin-bottom:1.4rem;}
table{width:100%;border-collapse:collapse;}
th{background:var(--sf2);color:var(--txd);font-family:var(--mono);font-size:0.69rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.65rem 1rem;text-align:left;border-bottom:1px solid var(--bd);}
td{padding:0.75rem 1rem;border-bottom:1px solid var(--bd);font-size:0.85rem;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--sf2);}
tr.sumrow td{background:var(--sf2);font-weight:700;border-top:2px solid var(--bd);}
.badge{display:inline-block;font-family:var(--mono);font-weight:700;font-size:0.85rem;padding:0.15rem 0.5rem;border-radius:4px;white-space:nowrap;border:1px solid;}
.badge.hi{color:#4fffb0;border-color:#4fffb0;background:rgba(79,255,176,0.07);}
.badge.mi{color:#ffc93c;border-color:#ffc93c;background:rgba(255,201,60,0.07);}
.badge.lo{color:var(--dg);border-color:var(--dg);background:rgba(255,79,106,0.07);}
.badge.tot{color:var(--ac2);border-color:var(--ac2);background:rgba(56,178,255,0.10);font-size:0.95rem;}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.4rem;}
.ccard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--sh);}
.ccard.full{grid-column:1/-1;}
.ctitle{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:0.9rem;}
.cwrap{position:relative;height:215px;}
.dcfwrap{position:relative;height:330px;}
.notice{font-family:var(--mono);font-size:0.71rem;color:var(--txd);background:var(--sf2);border:1px solid var(--bd);border-radius:var(--radius);padding:0.7rem 1rem;margin-bottom:1rem;}
.disclaimer{font-size:0.7rem;color:var(--txd);border-top:1px solid var(--bd);padding-top:1rem;margin-top:1.4rem;line-height:1.65;font-family:var(--mono);}
.hempty{text-align:center;padding:3rem;color:var(--txd);font-family:var(--mono);font-size:0.84rem;}
.hlist{display:flex;flex-direction:column;gap:0.7rem;}
.hitem{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1rem 1.2rem;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:var(--sh);cursor:pointer;transition:border-color var(--tr);}
.hitem:hover{border-color:var(--ac);}
.hticker{font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--ac);margin-bottom:0.18rem;}
.hco{font-size:0.85rem;color:var(--txm);margin-bottom:0.3rem;}
.hmeta{font-family:var(--mono);font-size:0.7rem;color:var(--txd);}
.hactions{display:flex;gap:0.45rem;margin-left:1rem;flex-direction:column;align-items:flex-end;}
.bsm{font-family:var(--mono);font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:4px;cursor:pointer;border:1px solid var(--bd);background:var(--sf2);color:var(--txm);transition:all var(--tr);white-space:nowrap;}
.bsm:hover{color:var(--tx);border-color:var(--ac2);}
.bsm.del:hover{color:var(--dg);border-color:var(--dg);}
.bsm.view{color:var(--ac2);border-color:var(--ac2);}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;overflow-y:auto;padding:2rem;}
#overlay.on{display:block;}
.ovpanel{background:var(--bg);max-width:1120px;margin:0 auto;border-radius:var(--radius);border:1px solid var(--bd);overflow:hidden;}
.ovhead{background:var(--sf);border-bottom:1px solid var(--bd);padding:0.9rem 1.4rem;display:flex;justify-content:space-between;align-items:center;}
.ovtitle{font-family:var(--mono);font-size:0.76rem;color:var(--txd);letter-spacing:0.1em;}
.closebtn{font-family:var(--mono);background:none;border:1px solid var(--bd);color:var(--txm);border-radius:4px;padding:0.22rem 0.7rem;cursor:pointer;transition:all var(--tr);}
.closebtn:hover{border-color:var(--dg);color:var(--dg);}
.ovcontent{padding:1.4rem;}
@media(max-width:680px){.cgrid{grid-template-columns:1fr;}.panel{padding:1rem;}header{padding:0 1rem;}.tabs{padding:0 1rem;}}
</style>
</head>
<body>
<header>
  <div class="logo">FA<span>::</span>DASHBOARD</div>
  <div class="hc">
    <button class="tbtn" id="lang-btn" onclick="toggleLang()">EN</button>
    <button class="tbtn" id="theme-btn" onclick="toggleTheme()">☀ LIGHT</button>
  </div>
</header>
<div class="tabs">
  <div class="tab active" id="tab-analyse" onclick="switchTab('analyse')">Analyse</div>
  <div class="tab" id="tab-history" onclick="switchTab('history')">Verlauf &amp; Favoriten</div>
</div>
<div class="panel active" id="panel-analyse">
  <div class="scard">
    <div class="slabel">Ticker-Symbol eingeben</div>
    <div class="srow">
      <input type="text" id="ticker-input" placeholder="z.B. AAPL" autocomplete="off" spellcheck="false">
      <button class="sbtn" id="sbtn" onclick="startAnalysis()">Analysieren</button>
    </div>
    <div class="status" id="status"></div>
  </div>
  <div id="results"></div>
</div>
<div class="panel" id="panel-history">
  <div class="stitle">Gespeicherte Analysen (max. 10)</div>
  <div id="hlist"></div>
</div>
<div id="overlay">
  <div class="ovpanel">
    <div class="ovhead">
      <div class="ovtitle" id="ovtitle">GESPEICHERTE ANALYSE</div>
      <button class="closebtn" onclick="closeOverlay()">✕ Schließen</button>
    </div>
    <div class="ovcontent" id="ovcontent"></div>
  </div>
</div>

<script>
const FH_KEY  = 'd9jr0g1r01qr77bnrgh0d9jr0g1r01qr77bnrghg';
const FH_BASE = 'https://finnhub.io/api/v1';
const MAX_H   = 10;
let lang = 'de', theme = 'dark';

// ── THEME / LANG ──────────────────────────────
function toggleTheme(){
  theme = theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('theme-btn').textContent = theme==='dark'?'☀ LIGHT':'☾ DARK';
  reRenderCharts();
}
function toggleLang(){
  lang = lang==='de'?'en':'de';
  document.documentElement.setAttribute('data-lang',lang);
  document.getElementById('lang-btn').textContent = lang==='de'?'EN':'DE';
}

// ── TABS ──────────────────────────────────────
function switchTab(n){
  ['analyse','history'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===n);
    document.getElementById('panel-'+t).classList.toggle('active',t===n);
  });
  if(n==='history') renderHistory();
}

// ── STORAGE ───────────────────────────────────
function getH(){try{return JSON.parse(localStorage.getItem('fa_h')||'[]');}catch{return[];}}
function saveH(a){localStorage.setItem('fa_h',JSON.stringify(a.slice(0,MAX_H)));}
function addH(e){let h=getH().filter(x=>x.ticker!==e.ticker);h.unshift(e);saveH(h);}
function delH(t){saveH(getH().filter(e=>e.ticker!==t));renderHistory();}

// ── STATUS ────────────────────────────────────
function setStatus(msg,type=''){
  const el=document.getElementById('status');
  el.className='status '+type;
  el.innerHTML=type==='loading'?`<span class="spin"></span>${msg}`:msg;
}

// ── FETCH ─────────────────────────────────────
async function fh(path, params={}){
  const p = new URLSearchParams({...params, token: FH_KEY});
  const r = await fetch(`${FH_BASE}${path}?${p}`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
async function fhSafe(path, params={}){
  try{ return await fh(path,params); }catch(e){ console.warn('fhSafe',path,e.message); return null; }
}

// ── UTILS ─────────────────────────────────────
function n(v){ const x=parseFloat(v); return isNaN(x)?null:x; }
function nf(v,d=2,s=''){const x=n(v);return x===null?'N/A':x.toFixed(d)+s;}
function fmtB(v){
  const x=n(v);if(x===null)return'N/A';
  if(Math.abs(x)>=1e12)return(x/1e12).toFixed(2)+' T';
  if(Math.abs(x)>=1e9) return(x/1e9).toFixed(2)+' B';
  if(Math.abs(x)>=1e6) return(x/1e6).toFixed(2)+' M';
  return x.toLocaleString();
}

// ── RATINGS ───────────────────────────────────
function computeRatings(d){
  function sc(v,g,ok,b,inv=false){
    if(v===null||isNaN(v))return 5;
    if(!inv)return v>=g?9:v>=ok?6:v>=b?3:2;
    return v<=g?9:v<=ok?6:v<=b?3:2;
  }
  function cl(v){return Math.max(1,Math.min(10,Math.round(v)));}
  const r1=cl((sc(d.gm,0.5,0.3,0.15)+sc(d.rev5,0.15,0.07,0.02))/2);
  const r2=cl((sc(d.rev5,0.15,0.07,0.02)+sc(d.roe,0.2,0.12,0.06)+sc(d.roic,0.15,0.09,0.04)+sc(d.de,0.5,1.5,3,true))/4);
  let vs=5;
  if(d.pe!==null&&!isNaN(d.pe))vs=d.pe<12?9:d.pe<18?7:d.pe<28?5:d.pe<40?3:2;
  const v2=d.ev!==null?(d.ev<10?9:d.ev<18?6:d.ev<30?4:2):5;
  const r3=cl((vs+v2)/2);
  const r4=cl(sc(d.roic,0.18,0.10,0.05));
  const r5=5,r8=5;
  const r6=cl((sc(d.cr,2,1.2,0.8)+sc(d.de,0.3,1,2.5,true))/2);
  const r7=cl(sc(d.rev5,0.2,0.1,0.03));
  const tot=cl((r1+r2+r3+r4+r5+r6+r7+r8)/8);
  return{
    sc:[r1,r2,r3,r4,r5,r6,r7,r8],tot,
    lDE:['Geschäftsmodell & Wettbewerbsposition','Finanzkennzahlen','Bewertung','Management & Governance','Branche & makroökonom. Umfeld','Bilanzqualität & Risiken','Katalysatoren (2–5 Jahre)','Sentiment & Kontraindikatoren'],
    lEN:['Business Model & Competitive Position','Financial Metrics','Valuation','Management & Governance','Industry & Macro Environment','Balance Sheet Quality & Risks','Catalysts (2–5 Years)','Sentiment & Counter-Indicators']
  };
}

// ── DCF ───────────────────────────────────────
function dcfEst(cf, shares){
  try{
    const fcfs=(cf||[]).map(r=>{
      const op=n(r.operatingCashflow),cap=n(r.capitalExpenditures);
      return(op!==null&&cap!==null)?op-Math.abs(cap):null;
    }).filter(v=>v!==null&&v>0);
    if(!fcfs.length)return null;
    const avg=fcfs.reduce((a,b)=>a+b,0)/fcfs.length;
    const g=0.05,r=0.09,N=5;
    let pv=0;for(let i=1;i<=N;i++)pv+=(avg*Math.pow(1+g,i))/Math.pow(1+r,i);
    const tv=(avg*Math.pow(1+g,N)*1.02)/((r-0.02)*Math.pow(1+r,N));
    const sh=n(shares);
    if(!sh||sh<=0)return null;
    return(pv+tv)/sh;
  }catch{return null;}
}

// ── CHARTS ────────────────────────────────────
let chartData=null,charts={};
function killCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch{}});charts={};}
function getC(){
  const dk=document.documentElement.getAttribute('data-theme')==='dark';
  return{a:dk?'#4fffb0':'#0a7c4e',b:dk?'#38b2ff':'#1565c0',w:'#ffc93c',d:dk?'#ff4f6a':'#c62828',g:dk?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.07)',t:dk?'#6b7590':'#9ba3be',bd:dk?'#252a38':'#dde2ee'};
}
function reRenderCharts(){if(chartData)drawCharts(chartData);}

function drawCharts(cd){
  killCharts();
  const c=getC(),de=lang==='de';
  const base={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:c.t,font:{family:"'Courier New',monospace",size:11}}},tooltip:{mode:'index',intersect:false}},
    scales:{x:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}},y:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}}}
  };

  // KGV
  const peEl=document.getElementById('c-pe');
  if(peEl)charts.pe=new Chart(peEl,{type:'line',data:{labels:cd.yrs,datasets:[{
    label:de?'KGV':'P/E',data:cd.peH,borderColor:c.a,backgroundColor:c.a+'18',
    borderWidth:2,pointBackgroundColor:c.a,pointRadius:4,fill:true,tension:0.3
  }]},options:{...base}});

  // Margen
  const mgEl=document.getElementById('c-mg');
  if(mgEl)charts.mg=new Chart(mgEl,{type:'line',data:{labels:cd.yrs,datasets:[
    {label:de?'Bruttomarge %':'Gross %',data:cd.gmH,borderColor:c.a,borderWidth:2,pointRadius:4,tension:0.3,fill:false},
    {label:de?'Op. Marge %':'Op. %',data:cd.omH,borderColor:c.b,borderWidth:2,pointRadius:4,tension:0.3,fill:false},
    {label:de?'Nettomarge %':'Net %',data:cd.nmH,borderColor:c.w,borderWidth:2,pointRadius:4,tension:0.3,fill:false}
  ]},options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v!=null?v.toFixed(1)+'%':null}}}}});

  // Umsatz + ND/EBITDA
  const rvEl=document.getElementById('c-rv');
  if(rvEl)charts.rv=new Chart(rvEl,{type:'bar',data:{labels:cd.yrs,datasets:[
    {label:de?'Umsatz (Mrd.)':'Revenue (B)',data:cd.revH.map(v=>v!=null?(v/1e9).toFixed(2):null),backgroundColor:c.a+'55',borderColor:c.a,borderWidth:1,yAxisID:'y'},
    {label:'Net Debt/EBITDA',data:cd.ndH,type:'line',borderColor:c.d,borderWidth:2,pointRadius:4,yAxisID:'y1',tension:0.3}
  ]},options:{...base,scales:{x:base.scales.x,
    y:{...base.scales.y,position:'left',title:{display:true,text:de?'Mrd. USD':'B USD',color:c.t,font:{size:10}}},
    y1:{...base.scales.y,position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'ND/EBITDA',color:c.d,font:{size:10}}}
  }}});

  // DCF Säule
  const dcfEl=document.getElementById('c-dcf');
  if(dcfEl&&cd.price){
    const cp=cd.price,ath=cd.ath||cp*1.4,dcf=cd.dcf||null;
    const maxY=Math.max(cp,ath,dcf||0)*1.2;
    charts.dcf=new Chart(dcfEl,{
      type:'bar',
      data:{labels:[cd.ticker],datasets:[{data:[maxY],backgroundColor:c.a+'10',borderColor:c.bd,borderWidth:1}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{enabled:false}},
        scales:{x:{grid:{color:c.g},ticks:{color:c.t}},y:{min:0,max:maxY,grid:{color:c.g},ticks:{color:c.t,callback:v=>'$'+v.toFixed(0)}}}
      },
      plugins:[{id:'lines',afterDraw(chart){
        const{ctx,chartArea,scales}=chart;if(!chartArea)return;
        const yS=scales.y,x0=chartArea.left,x1=chartArea.right;
        function line(val,color,label,offY=0){
          if(val==null||isNaN(val))return;
          const y=yS.getPixelForValue(val);
          ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.setLineDash([6,4]);
          ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
          ctx.setLineDash([]);ctx.fillStyle=color;
          ctx.font='bold 11px Courier New,monospace';ctx.textAlign='left';
          ctx.fillText(label+': $'+Number(val).toFixed(2),x0+8,y-6+offY);
          ctx.restore();
        }
        const athY=yS.getPixelForValue(ath),cpY=yS.getPixelForValue(cp);
        line(ath,c.b,de?'52W-Hoch':'52W-High',0);
        line(cp,c.a,de?'Aktueller Kurs':'Current Price',Math.abs(athY-cpY)<20?14:0);
        if(dcf!=null)line(dcf,c.w,de?'Fairer Wert (DCF)':'DCF Fair Value',Math.abs(cpY-yS.getPixelForValue(dcf))<20?14:0);
      }}]
    });
  }
}

// ── MAIN ANALYSE ──────────────────────────────
async function startAnalysis(){
  const ticker=document.getElementById('ticker-input').value.trim().toUpperCase();
  if(!ticker){setStatus('Bitte einen Ticker eingeben.','error');return;}

  document.getElementById('sbtn').disabled=true;
  document.getElementById('results').innerHTML='';
  killCharts();chartData=null;

  try{
    setStatus('Schritt 1/4 — Kurs & Profil laden…','loading');
    const [quote, profile] = await Promise.all([
      fh('/quote',{symbol:ticker}),
      fhSafe('/stock/profile2',{symbol:ticker})
    ]);

    if(!quote||quote.c===0&&quote.h===0){
      setStatus(`Ticker „${ticker}" nicht gefunden. Nur US-Ticker (NYSE/NASDAQ) werden unterstützt.`,'error');
      document.getElementById('sbtn').disabled=false;
      return;
    }

    setStatus('Schritt 2/4 — Fundamentaldaten laden…','loading');
    const [metrics, financials] = await Promise.all([
      fhSafe('/stock/metric',{symbol:ticker,metric:'all'}),
      fhSafe('/financials-reported',{symbol:ticker,freq:'annual'})
    ]);

    setStatus('Schritt 3/4 — Finanzkennzahlen laden…','loading');
    const [income, cashflow, balance] = await Promise.all([
      fhSafe('/financials',{symbol:ticker,statement:'ic',freq:'annual'}),
      fhSafe('/financials',{symbol:ticker,statement:'cf',freq:'annual'}),
      fhSafe('/financials',{symbol:ticker,statement:'bs',freq:'annual'})
    ]);

    setStatus('Schritt 4/4 — Analyse erstellen…','loading');

    const m = metrics?.metric || {};
    const p = profile || {};

    // Kurs-Daten
    const price   = n(quote.c);
    const change  = n(quote.d);
    const changePct = n(quote.dp);
    const high52  = n(quote.h) || n(m['52WeekHigh']);
    const low52   = n(quote.l) || n(m['52WeekLow']);

    // Kennzahlen aus Metrics
    const pe      = n(m.peBasicExclExtraTTM) || n(m.peTTM);
    const pb      = n(m.pbQuarterly) || n(m.pbAnnual);
    const ps      = n(m.psTTM);
    const ev      = n(m.evEbitdaTTM);
    const roe     = n(m.roeTTM)   !== null ? n(m.roeTTM)/100   : null;
    const roic    = n(m.roicTTM)  !== null ? n(m.roicTTM)/100  : null;
    const gm      = n(m.grossMarginTTM)  !== null ? n(m.grossMarginTTM)/100  : null;
    const om      = n(m.operatingMarginTTM) !== null ? n(m.operatingMarginTTM)/100 : null;
    const nm      = n(m.netMarginTTM) !== null ? n(m.netMarginTTM)/100 : null;
    const de2     = n(m.totalDebt_totalEquityAnnual);
    const cr      = n(m.currentRatioAnnual) || n(m.currentRatioQuarterly);
    const eps     = n(m.epsBasicExclExtraItemsTTM) || n(m.epsTTM);
    const mktCap  = n(p.marketCapitalization) ? n(p.marketCapitalization)*1e6 : null;
    const beta    = n(m.beta);
    const divY    = n(m.dividendYieldIndicatedAnnual);
    const targetP = null; // nicht im Free-Plan

    // Umsatz-Daten aus financials
    const icData  = income?.financials   || [];
    const cfData  = cashflow?.financials  || [];
    const bsData  = balance?.financials   || [];

    // Revenue CAGR 5J
    const revArr = icData.slice(0,5).map(r=>n(r.revenue||r['Total Revenue']));
    const rev5 = (()=>{
      const vals=revArr.filter(v=>v!==null);
      if(vals.length<2)return null;
      const f=vals[vals.length-1],l=vals[0];
      return f>0?Math.pow(l/f,1/(vals.length-1))-1:null;
    })();

    // Cashflows für DCF
    const cfArr = cfData.slice(0,5).map(r=>({
      operatingCashflow: n(r['Cash from Operations']||r.operatingCashflow),
      capitalExpenditures: n(r['Capital Expenditures']||r.capitalExpenditures)
    }));
    const shares = n(m.sharesOutstanding) ? n(m.sharesOutstanding)*1e6 : null;
    const dcf = dcfEst(cfArr, shares);

    // Chart-Daten (5 Jahre)
    const yrs  = icData.slice(0,5).map(r=>r.period?.substring(0,4)||'').reverse();
    const revH = icData.slice(0,5).map(r=>n(r.revenue||r['Total Revenue'])).reverse();
    const gmH  = icData.slice(0,5).map(r=>{
      const rev=n(r.revenue||r['Total Revenue']),gp=n(r.grossProfit||r['Gross Profit']);
      return(rev&&gp)?+(gp/rev*100).toFixed(2):null;
    }).reverse();
    const omH  = icData.slice(0,5).map(r=>{
      const rev=n(r.revenue||r['Total Revenue']),op=n(r.operatingIncome||r['Operating Income']);
      return(rev&&op)?+(op/rev*100).toFixed(2):null;
    }).reverse();
    const nmH  = icData.slice(0,5).map(r=>{
      const rev=n(r.revenue||r['Total Revenue']),ni=n(r.netIncome||r['Net Income']);
      return(rev&&ni)?+(ni/rev*100).toFixed(2):null;
    }).reverse();
    const peH  = icData.slice(0,5).map(()=>null).reverse(); // historisches KGV nicht im Free-Plan
    const ndH  = icData.slice(0,5).map((inc,i)=>{
      const bs=bsData[i]||{};
      const td=n(bs.totalDebt||bs['Total Debt']||bs['Long Term Debt']);
      const ca=n(bs.cashAndEquivalents||bs['Cash And Equivalents']);
      const eb=n(inc.ebitda||inc['EBITDA']);
      return(td!==null&&ca!==null&&eb&&eb>0)?+((td-ca)/eb).toFixed(2):null;
    }).reverse();

    chartData={yrs,revH,gmH,omH,nmH,peH,ndH,price,ath:high52,dcf,ticker,profile:p};

    const R = computeRatings({gm,roe,roic,de:de2,cr,pe,ev,rev5});
    const rd = {ticker,p,quote,m,R,price,high52,low52,mktCap,pe,ev,pb,ps,roe,roic,gm,om,nm,de:de2,cr,eps,rev5,dcf,beta,divY,change,changePct};

    setStatus('✓ Analyse abgeschlossen — '+(p.name||ticker),'ok');
    render(rd,'results');
    addH({ticker,companyName:p.name||ticker,timestamp:new Date().toISOString(),rating:R.tot,price,industry:p.finnhubIndustry||'',rd,cd:chartData});

  }catch(e){
    setStatus('Fehler: '+e.message,'error');
    console.error(e);
  }
  document.getElementById('sbtn').disabled=false;
}

// ── RENDER ────────────────────────────────────

  const bc=r=>r>=7?'hi':r>=5?'mi':'lo';

    d.gm  ?`Bruttomarge ${(d.gm*100).toFixed(1)}% — ${d.gm>0.4?'starkes Preissetzungsvermögen':d.gm>0.25?'solide Margenstruktur':'schwache Margenstruktur'}`:'Information nicht nachweisbar',
    d.roe ?`ROE ${(d.roe*100).toFixed(1)}%, ROIC ${d.roic?(d.roic*100).toFixed(1):'-'}% — ${d.roe>0.15?'gute Kapitalrendite':'moderate Kapitalrendite'}`:'Information nicht nachweisbar',
    d.pe  ?`KGV ${Number(d.pe).toFixed(1)} — ${d.pe<18?'attraktiv bewertet':d.pe<30?'fair bewertet':'Premium-Bewertung'}`:'Information nicht nachweisbar',
    d.roic?`ROIC ${(d.roic*100).toFixed(1)}% — ${d.roic>0.12?'gute Kapitalallokation erkennbar':'moderate Kapitalallokation'}`:'Information nicht nachweisbar',
    'Zyklizität, Regulierung & Disruptionsrisiken: Information nicht nachweisbar',

    d.rev5?`Umsatz-CAGR 5J: ${(d.rev5*100).toFixed(1)}% — ${d.rev5>0.1?'starkes Wachstum als Katalysator':'moderates Wachstumspotenzial'}`:'Information nicht nachweisbar',
    'Short Interest & Insider-Trades: Information nicht nachweisbar (kostenpflichtige Daten)'
  ];

    d.gm  ?`Gross margin ${(d.gm*100).toFixed(1)}% — ${d.gm>0.4?'strong pricing power':d.gm>0.25?'solid margin structure':'weak margin structure'}`:'Information not verifiable',
    d.roe ?`ROE ${(d.roe*100).toFixed(1)}%, ROIC ${d.roic?(d.roic*100).toFixed(1):'-'}% — ${d.roe>0.15?'strong capital returns':'moderate capital returns'}`:'Information not verifiable',
    d.pe  ?`P/E ${Number(d.pe).toFixed(1)} — ${d.pe<18?'attractive valuation':d.pe<30?'fair valuation':'premium valuation'}`:'Information not verifiable',
    d.roic?`ROIC ${(d.roic*100).toFixed(1)}% — ${d.roic>0.12?'good capital allocation visible':'moderate capital allocation'}`:'Information not verifiable',
    'Cyclicality, regulation & disruption risks: Information not verifiable',
    d.de  !=null?`Debt/Equity ${d.de.toFixed(2)} — ${d.de<1?'conservative balance sheet':d.de<2.5?'moderate leverage':'high leverage'}; Current Ratio ${d.cr?d.cr.toFixed(2):'-'}`:'Information not verifiable',
    d.rev5?`Revenue CAGR 5Y: ${(d.rev5*100).toFixed(1)}% — ${d.rev5>0.1?'strong organic growth catalyst':'moderate growth potential'}`:'Information not verifiable',
    'Short interest & insider transactions: Information not verifiable (paid data required)'
  ];
  const tDE=d.R.tot>=7?`${name} zeigt mit ${d.R.tot}/10 solide Fundamentaldaten — mittelfristig investierbar.`:d.R.tot>=5?`${name} zeigt mit ${d.R.tot}/10 gemischte Fundamentaldaten — sorgfältige Prüfung empfohlen.`:`${name} zeigt mit ${d.R.tot}/10 schwache Fundamentaldaten — mittelfristig nicht überzeugend.`;
  const tEN=d.R.tot>=7?`${name} shows solid fundamentals at ${d.R.tot}/10 — investable medium-term.`:d.R.tot>=5?`${name} shows mixed fundamentals at ${d.R.tot}/10 — careful review recommended.`:`${name} shows weak fundamentals at ${d.R.tot}/10 — not convincing medium-term.`;

  c.innerHTML=`
  <div class="cohead">
    <div>
      <div class="coname">${name}</div>
      <div class="cometa">${d.ticker} · ${d.p.exchange||''} · ${d.p.finnhubIndustry||''} · ${d.p.country||''}</div>
      <div class="codesc">${(d.p.description||'').substring(0,240)}${(d.p.description||'').length>240?'…':''}</div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div class="pval">$${nf(d.price,2)}</div>
      <div class="pchg ${pnc}">${sign}${nf(diff,2)} (${sign}${nf(pct,2)}%)</div>
      <div class="cometa" style="margin-top:0.4rem">52W H: $${nf(d.high52,2)} · T: $${nf(d.low52,2)}</div>
      <div class="cometa">Beta: ${nf(d.beta,2)} · Div: ${nf(d.divY,2,'%')}</div>
    </div>
  </div>

  <div class="stitle">${de?'Kennzahlen-Übersicht':'Key Metrics'}</div>
  <div class="mgrid">
    <div class="mcard"><div class="mlabel">KGV / P/E</div><div class="mval a">${nf(d.pe,1,'x')}</div></div>
    <div class="mcard"><div class="mlabel">EV/EBITDA</div><div class="mval">${nf(d.ev,1,'x')}</div></div>
    <div class="mcard"><div class="mlabel">KBV / P/B</div><div class="mval">${nf(d.pb,2,'x')}</div></div>
    <div class="mcard"><div class="mlabel">KUV / P/S</div><div class="mval">${nf(d.ps,2,'x')}</div></div>
    <div class="mcard"><div class="mlabel">ROE (TTM)</div><div class="mval b">${nf(d.roe?d.roe*100:null,1,'%')}</div></div>
    <div class="mcard"><div class="mlabel">ROIC (TTM)</div><div class="mval b">${nf(d.roic?d.roic*100:null,1,'%')}</div></div>
    <div class="mcard"><div class="mlabel">${de?'Nettomarge':'Net Margin'}</div><div class="mval">${nf(d.nm?d.nm*100:null,1,'%')}</div></div>
    <div class="mcard"><div class="mlabel">${de?'Verschuldung/EK':'Debt/Equity'}</div><div class="mval">${nf(d.de,2,'x')}</div></div>
    <div class="mcard"><div class="mlabel">${de?'Marktkapitalisierung':'Market Cap'}</div><div class="mval">${fmtB(d.mktCap)}</div></div>
    <div class="mcard"><div class="mlabel">EPS (TTM)</div><div class="mval">$${nf(d.eps,2)}</div></div>
    <div class="mcard"><div class="mlabel">${de?'Umsatz-CAGR 5J':'Rev. CAGR 5Y'}</div><div class="mval">${nf(d.rev5?d.rev5*100:null,1,'%')}</div></div>
    <div class="mcard"><div class="mlabel">DCF ${de?'Fairer Wert':'Fair Value'}</div><div class="mval a">${d.dcf?'$'+d.dcf.toFixed(2):'N/A'}</div></div>
  </div>

  <div class="stitle">${de?'Fundamentalanalyse — 8 Bereiche':'Fundamental Analysis — 8 Dimensions'}</div>
  <div class="notice">${de?'⚠ Bereiche ohne kostenlose Daten sind als „Information nicht nachweisbar" gekennzeichnet.':'⚠ Dimensions without free data are marked as "Information not verifiable".'}</div>
  <div class="twrap"><table>
    <thead><tr>
      <th style="width:38%">${de?'Bereich':'Dimension'}</th>

    </tr></thead>
    <tbody>
      ${d.R.sc.map((r,i)=>`<tr>
        <td><strong>${i+1}. ${de?d.R.lDE[i]:d.R.lEN[i]}</strong></td>
        <td><span class="badge ${bc(r)}">${r}/10</span></td>
        <td style="font-size:0.82rem;color:var(--txm)">${de?notesDE[i]:notesEN[i]}</td>
      </tr>`).join('')}
      <tr class="sumrow">
        <td>${de?'Gesamtzusammenfassung':'Overall Summary'}</td>

    </tbody>

  <div class="stitle">${de?'Historische Daten (5 Jahre)':'Historical Data (5 Years)'}</div>

    <div class="ccard"><div class="ctitle">${de?'KGV-Verlauf':'P/E History'}</div><div class="cwrap"><canvas id="c-pe"></canvas></div></div>

    <div class="ccard full"><div class="ctitle">${de?'Margenentwicklung (Brutto / Operativ / Netto)':'Margin Development (Gross / Operating / Net)'}</div><div class="cwrap"><canvas id="c-mg"></canvas></div></div>
    <div class="ccard full"><div class="ctitle">${de?'Kursspanne &amp; DCF-Bewertung':'Price Range &amp; DCF Valuation'}</div><div class="dcfwrap"><canvas id="c-dcf"></canvas></div></div>

  <div class="disclaimer">${de
    ?'⚠ Keine Anlageberatung. Daten: Finnhub API (Free Plan, 60 Calls/min). Nur US-Ticker zuverlässig. DCF mit vereinfachten Annahmen (WACC 9 %, g 5 %). KGV-Verlauf nicht im Free-Plan verfügbar.'

  setTimeout(()=>drawCharts(chartData),60);
}

// ── HISTORY ───────────────────────────────────
function renderHistory(){
  const h=getH(),el=document.getElementById('hlist'),de=lang==='de';
  if(!h.length){el.innerHTML=`<div class="hempty">${de?'— Noch keine Analysen gespeichert —':'— No analyses saved yet —'}</div>`;return;}
  el.innerHTML=`<div class="hlist">${h.map(item=>{
    const ds=new Date(item.timestamp).toLocaleString(de?'de-DE':'en-US',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    const rc=item.rating>=7?'hi':item.rating>=5?'mi':'lo';
    return`<div class="hitem" onclick="openItem('${item.ticker}')">
      <div style="flex:1">
        <div class="hticker">${item.ticker}</div>
        <div class="hco">${item.companyName||''}</div>
        <div class="hmeta">${item.industry||''} · ${ds}</div>
        <div class="hmeta" style="margin-top:0.2rem">${de?'Kurs':'Price'}: $${item.price?Number(item.price).toFixed(2):'N/A'}</div>
      </div>
      <div class="hactions">
        <span class="badge ${rc}" style="font-size:1rem;padding:0.28rem 0.65rem">${item.rating}/10</span>
        <button class="bsm view" onclick="event.stopPropagation();openItem('${item.ticker}')">${de?'Anzeigen':'View'}</button>
        <button class="bsm del" onclick="event.stopPropagation();delH('${item.ticker}')">${de?'Löschen':'Delete'}</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function openItem(ticker){
  const item=getH().find(e=>e.ticker===ticker);
  if(!item?.rd)return;
  document.getElementById('ovtitle').textContent=`${ticker} — ${new Date(item.timestamp).toLocaleDateString()}`;
  document.getElementById('ovcontent').innerHTML='<div id="ov-inner"></div>';
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow='hidden';
  chartData=item.cd;
  render(item.rd,'ov-inner');
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('on');
  document.body.style.overflow='';
}

document.getElementById('ticker-input').addEventListener('keydown',e=>{if(e.key==='Enter')startAnalysis();});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeOverlay();});
</script>
