<!DOCTYPE html>
<html lang="de" data-theme="dark" data-lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua Host · Analyseprogramm</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--mono:'Courier New',Courier,monospace;--sans:'Segoe UI',system-ui,-apple-system,sans-serif;--radius:8px;--tr:0.18s ease;}
[data-theme="dark"]{--bg:#0d0f12;--sf:#151820;--sf2:#1c2030;--bd:#252a38;--ac:#4fffb0;--ac2:#38b2ff;--dg:#ff4f6a;--wn:#ffc93c;--tx:#e8eaf0;--txd:#6b7590;--txm:#9ba3be;--tabbg:#1c2030;--tabac:#151820;--inbg:#0d0f12;--sh:0 2px 16px rgba(0,0,0,0.4);}
[data-theme="light"]{--bg:#f4f6fb;--sf:#fff;--sf2:#eef1f8;--bd:#dde2ee;--ac:#0a7c4e;--ac2:#1565c0;--dg:#c62828;--wn:#b45309;--tx:#111827;--txd:#9ba3be;--txm:#4a5270;--tabbg:#eef1f8;--tabac:#fff;--inbg:#fff;--sh:0 2px 16px rgba(0,0,0,0.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);min-height:100vh;transition:background var(--tr),color var(--tr);}

/* HEADER */
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:var(--sh);}
.logo{font-family:var(--mono);font-size:0.95rem;font-weight:700;color:var(--ac);letter-spacing:0.04em;}
.logo span{color:var(--txm);font-weight:400;}
.hc{display:flex;gap:0.6rem;align-items:center;}
.tbtn{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:0.28rem 0.8rem;font-size:0.76rem;font-family:var(--mono);color:var(--txm);cursor:pointer;transition:all var(--tr);}
.tbtn:hover{border-color:var(--ac);color:var(--ac);}

/* TABS + PDF BTN */
.tabbar{display:flex;background:var(--tabbg);border-bottom:1px solid var(--bd);padding:0 2rem;align-items:center;justify-content:space-between;}
.tabs{display:flex;}
.tab{padding:0.8rem 1.4rem;font-size:0.84rem;font-weight:600;cursor:pointer;color:var(--txd);border-bottom:2px solid transparent;transition:all var(--tr);user-select:none;}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--ac);border-bottom-color:var(--ac);background:var(--tabac);}
.pdf-btn{font-family:var(--mono);font-size:0.74rem;background:var(--sf2);border:1px solid var(--bd);color:var(--txm);border-radius:6px;padding:0.25rem 0.75rem;cursor:pointer;transition:all var(--tr);white-space:nowrap;}
.pdf-btn:hover{border-color:var(--ac2);color:var(--ac2);}

/* PANELS */
.panel{display:none;padding:2rem;max-width:1120px;margin:0 auto;}
.panel.active{display:block;}

/* SEARCH */
.scard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.5rem 2rem;margin-bottom:1.5rem;box-shadow:var(--sh);}
.slabel{font-family:var(--mono);font-size:0.7rem;color:var(--txd);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:0.6rem;}
.srow{display:flex;gap:0.7rem;align-items:center;flex-wrap:wrap;position:relative;}
.search-wrap{position:relative;flex:0 0 auto;}
#ticker-input{font-family:var(--mono);font-size:1.1rem;font-weight:700;background:var(--inbg);border:1.5px solid var(--bd);border-radius:var(--radius);color:var(--tx);padding:0.55rem 1rem;width:280px;letter-spacing:0.06em;text-transform:uppercase;outline:none;transition:border-color var(--tr);}
#ticker-input:focus{border-color:var(--ac);}
#ticker-input::placeholder{color:var(--txd);font-weight:400;letter-spacing:0.04em;font-size:0.9rem;text-transform:none;}
.sbtn{background:var(--ac);color:#0d0f12;border:none;border-radius:var(--radius);padding:0.6rem 1.5rem;font-size:0.86rem;font-weight:700;font-family:var(--mono);letter-spacing:0.06em;cursor:pointer;transition:opacity var(--tr);}
.sbtn:hover{opacity:0.85;}
.sbtn:disabled{opacity:0.35;cursor:not-allowed;}

/* AUTOCOMPLETE DROPDOWN */
#autocomplete{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);box-shadow:var(--sh);z-index:500;display:none;max-height:240px;overflow-y:auto;}
#autocomplete.visible{display:block;}
.ac-item{padding:0.6rem 1rem;cursor:pointer;display:flex;align-items:center;gap:0.75rem;transition:background var(--tr);}
.ac-item:hover,.ac-item.selected{background:var(--sf2);}
.ac-ticker{font-family:var(--mono);font-size:0.82rem;font-weight:700;color:var(--ac);min-width:70px;}
.ac-name{font-size:0.82rem;color:var(--txm);}
.ac-type{font-family:var(--mono);font-size:0.68rem;color:var(--txd);margin-left:auto;}
.ac-sep{padding:0.3rem 1rem;font-family:var(--mono);font-size:0.66rem;color:var(--txd);letter-spacing:0.1em;text-transform:uppercase;background:var(--sf2);border-bottom:1px solid var(--bd);}

/* STATUS */
.status{font-family:var(--mono);font-size:0.76rem;margin-top:0.55rem;min-height:1.1rem;display:flex;align-items:center;gap:0.45rem;flex-wrap:wrap;}
.status.loading{color:var(--ac2);}
.status.error{color:var(--dg);}
.status.ok{color:var(--ac);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}

/* COMPARE STRIP */
#compare-strip{display:none;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--radius);padding:1rem 1.5rem;margin-bottom:1rem;gap:0.75rem;align-items:center;flex-wrap:wrap;}
#compare-strip.visible{display:flex;}
#compare-input{font-family:var(--mono);font-size:1rem;font-weight:700;background:var(--inbg);border:1.5px solid var(--bd);border-radius:var(--radius);color:var(--tx);padding:0.5rem 0.9rem;width:220px;letter-spacing:0.06em;text-transform:uppercase;outline:none;transition:border-color var(--tr);}
#compare-input:focus{border-color:var(--ac2);}
.compare-label{font-family:var(--mono);font-size:0.76rem;color:var(--txd);}
.cbtn{background:var(--ac2);color:#fff;border:none;border-radius:var(--radius);padding:0.5rem 1.2rem;font-size:0.82rem;font-weight:700;font-family:var(--mono);cursor:pointer;transition:opacity var(--tr);}
.cbtn:hover{opacity:0.85;}
.close-compare{font-family:var(--mono);font-size:0.72rem;background:none;border:1px solid var(--bd);color:var(--txd);border-radius:4px;padding:0.22rem 0.6rem;cursor:pointer;transition:all var(--tr);}
.close-compare:hover{border-color:var(--dg);color:var(--dg);}

/* RESULTS GRID (single or compare) */
#results-grid{display:grid;gap:1.5rem;}
#results-grid.compare-mode{grid-template-columns:1fr 1fr;}

/* COMPANY HEADER */
.cohead{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1.1rem 1.4rem;margin-bottom:0.8rem;box-shadow:var(--sh);}
.cohead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;}
.cohead-left{display:flex;align-items:flex-start;gap:0.85rem;flex:1;}
.co-logo{width:42px;height:42px;border-radius:8px;object-fit:contain;background:var(--sf2);border:1px solid var(--bd);flex-shrink:0;}
.co-logo-placeholder{width:42px;height:42px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:0.8rem;font-weight:700;color:var(--txd);flex-shrink:0;}
.coname{font-size:1.3rem;font-weight:700;line-height:1.2;}
.cometa{font-family:var(--mono);font-size:0.74rem;color:var(--txd);margin-top:0.2rem;}
.codesc{font-size:0.8rem;color:var(--txm);margin-top:0.5rem;line-height:1.55;max-width:500px;}
.coright{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;}
.pval{font-family:var(--mono);font-size:1.6rem;font-weight:700;color:var(--ac);}
.pchg{font-family:var(--mono);font-size:0.8rem;}
.pos{color:#4fffb0;}.neg{color:var(--dg);}
.cohead-actions{display:flex;align-items:center;gap:0.6rem;margin-top:0.7rem;flex-wrap:wrap;}

/* AMPEL */
.ampel{display:inline-flex;align-items:center;gap:0.45rem;font-family:var(--mono);font-size:0.76rem;}
.ampel-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.ampel-dot.green{background:#4fffb0;}
.ampel-dot.yellow{background:#ffc93c;}
.ampel-dot.red{background:#ff4f6a;}

/* STAR */
.star-btn{background:none;border:none;cursor:pointer;font-size:1.4rem;line-height:1;padding:0.1rem;transition:transform 0.15s;color:var(--wn);}
.star-btn:hover{transform:scale(1.2);}

/* COMPARE BTN */
.compare-open-btn{font-family:var(--mono);font-size:0.74rem;background:var(--sf2);border:1px solid var(--bd);color:var(--txm);border-radius:6px;padding:0.22rem 0.7rem;cursor:pointer;transition:all var(--tr);}
.compare-open-btn:hover{border-color:var(--ac2);color:var(--ac2);}

/* ACCORDION */
.acc-section{margin-bottom:0.5rem;}
.acc-btn{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:0.8rem 1.2rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:0.87rem;font-weight:600;color:var(--tx);transition:all var(--tr);box-shadow:var(--sh);}
.acc-btn:hover{border-color:var(--ac);color:var(--ac);}
.acc-btn.open{border-color:var(--ac);color:var(--ac);border-bottom-left-radius:0;border-bottom-right-radius:0;}
.acc-arrow{font-size:0.72rem;transition:transform 0.2s;color:var(--txd);}
.acc-btn.open .acc-arrow{transform:rotate(180deg);}
.acc-body{display:none;background:var(--sf);border:1px solid var(--ac);border-top:none;border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius);padding:1.1rem;}
.acc-body.open{display:block;}

/* CHART SUB-ACCORDION */
.chart-acc-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:0.5rem 0.9rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:0.78rem;font-family:var(--mono);color:var(--txm);transition:all var(--tr);width:100%;margin-bottom:0.35rem;}
.chart-acc-btn:hover,.chart-acc-btn.open{border-color:var(--ac2);color:var(--ac2);}
.chart-acc-body{display:none;padding:0.8rem 0 0.4rem;}
.chart-acc-body.open{display:block;}
.cwrap{position:relative;height:230px;}
.dcfwrap{position:relative;height:300px;}

/* METRICS */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:0.65rem;}
.mcard{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:0.75rem 0.85rem;cursor:pointer;transition:all var(--tr);position:relative;}
.mcard:hover{border-color:var(--ac2);transform:translateY(-1px);}
.mcard.expanded{border-color:var(--ac2);grid-column:span 2;background:var(--sf);}
.mlabel{font-family:var(--mono);font-size:0.64rem;color:var(--txd);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:0.25rem;}
.mval{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--tx);}
.mval.a{color:var(--ac);}.mval.b{color:var(--ac2);}.mval.w{color:var(--wn);}.mval.g{color:#4fffb0;}.mval.r{color:var(--dg);}
.mcard-explain{display:none;font-size:0.78rem;color:var(--txm);line-height:1.55;margin-top:0.6rem;padding-top:0.6rem;border-top:1px solid var(--bd);}
.mcard.expanded .mcard-explain{display:block;}

/* TABLE */
.twrap{overflow:hidden;border-radius:6px;border:1px solid var(--bd);}
table{width:100%;border-collapse:collapse;}
th{background:var(--sf2);color:var(--txd);font-family:var(--mono);font-size:0.67rem;letter-spacing:0.1em;text-transform:uppercase;padding:0.6rem 0.9rem;text-align:left;border-bottom:1px solid var(--bd);}
td{padding:0.65rem 0.9rem;border-bottom:1px solid var(--bd);font-size:0.83rem;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--sf2);}
tr.sumrow td{background:var(--sf2);font-weight:700;border-top:2px solid var(--bd);}
.badge{display:inline-block;font-family:var(--mono);font-weight:700;font-size:0.8rem;padding:0.12rem 0.42rem;border-radius:4px;white-space:nowrap;border:1px solid;}
.badge.hi{color:#4fffb0;border-color:#4fffb0;background:rgba(79,255,176,0.07);}
.badge.mi{color:#ffc93c;border-color:#ffc93c;background:rgba(255,201,60,0.07);}
.badge.lo{color:var(--dg);border-color:var(--dg);background:rgba(255,79,106,0.07);}
.badge.tot{color:var(--ac2);border-color:var(--ac2);background:rgba(56,178,255,0.10);font-size:0.9rem;}

/* DISCLAIMER */
.disclaimer{font-size:0.68rem;color:var(--txd);border-top:1px solid var(--bd);padding-top:0.85rem;margin-top:0.85rem;line-height:1.6;font-family:var(--mono);}

/* TIMESTAMP */
.timestamp{font-family:var(--mono);font-size:0.68rem;color:var(--txd);margin-top:0.3rem;}

/* FAVORITES */
.fav-empty{text-align:center;padding:3rem;color:var(--txd);font-family:var(--mono);font-size:0.84rem;line-height:2;}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.75rem;}
.fav-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);padding:1rem 1.2rem;box-shadow:var(--sh);cursor:pointer;transition:border-color var(--tr),transform 0.15s;}
.fav-card:hover{border-color:var(--ac);transform:translateY(-2px);}
.fav-ticker{font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--ac);}
.fav-name{font-size:0.85rem;color:var(--txm);margin:0.12rem 0;}
.fav-meta{font-family:var(--mono);font-size:0.68rem;color:var(--txd);}
.fav-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.55rem;}
.fav-del{font-family:var(--mono);font-size:0.68rem;padding:0.16rem 0.5rem;border-radius:4px;cursor:pointer;border:1px solid var(--bd);background:none;color:var(--txd);transition:all var(--tr);}
.fav-del:hover{color:var(--dg);border-color:var(--dg);}

/* DETAIL VIEW */
#detail-view{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;}
#detail-view.on{display:block;}
.detail-topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 2rem;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:var(--sh);}
.detail-title{font-family:var(--mono);font-size:0.8rem;color:var(--txd);letter-spacing:0.08em;}
.detail-close{font-family:var(--mono);background:none;border:1px solid var(--bd);color:var(--txm);border-radius:6px;padding:0.25rem 0.8rem;cursor:pointer;font-size:0.78rem;transition:all var(--tr);}
.detail-close:hover{border-color:var(--dg);color:var(--dg);}
.detail-content{padding:2rem;max-width:1120px;margin:0 auto;}

@media print{header,.tabbar,#compare-strip,.scard,.star-btn,.compare-open-btn,.acc-btn,.chart-acc-btn,.fav-del,.detail-close{display:none!important;}.acc-body,.chart-acc-body{display:block!important;}.panel{display:block!important;padding:0;}}
@media(max-width:700px){#results-grid.compare-mode{grid-template-columns:1fr;}.panel{padding:1rem;}.detail-content{padding:1rem;}header{padding:0 1rem;}.tabbar{padding:0 1rem;}}
</style>
</head>
<body>

<header>
  <div class="logo">Joshua Host<span> · Analyseprogramm</span></div>
  <div class="hc">
    <button class="tbtn" id="lang-btn" onclick="toggleLang()">EN</button>
    <button class="tbtn" id="theme-btn" onclick="toggleTheme()">☀ LIGHT</button>
  </div>
</header>

<div class="tabbar">
  <div class="tabs">
    <div class="tab active" id="tab-analyse" onclick="switchTab('analyse')">Analyse</div>
    <div class="tab" id="tab-favs" onclick="switchTab('favs')">Favoriten</div>
  </div>
  <button class="pdf-btn" onclick="exportPDF()" id="pdf-btn">⬇ PDF exportieren</button>
</div>

<div class="panel active" id="panel-analyse">
  <div class="scard">
    <div class="slabel" id="slabel-text">Ticker oder Firmenname eingeben</div>
    <div class="srow">
      <div class="search-wrap">
        <input type="text" id="ticker-input" placeholder="z.B. AAPL oder Apple" autocomplete="off" spellcheck="false">
        <div id="autocomplete"></div>
      </div>
      <button class="sbtn" id="sbtn" onclick="startAnalysis()">Analysieren</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <!-- COMPARE STRIP -->
  <div id="compare-strip">
    <span class="compare-label" id="compare-label-text">Vergleichs-Ticker:</span>
    <div style="position:relative">
      <input type="text" id="compare-input" placeholder="z.B. MSFT" autocomplete="off" spellcheck="false">
      <div id="autocomplete2"></div>
    </div>
    <button class="cbtn" onclick="startCompare()" id="compare-sbtn">Vergleichen</button>
    <button class="close-compare" onclick="closeCompare()">✕ Schließen</button>
  </div>

  <div id="results-grid"></div>
</div>

<div class="panel" id="panel-favs">
  <div id="favs-list"></div>
</div>

<!-- FULL-PAGE DETAIL VIEW -->
<div id="detail-view">
  <div class="detail-topbar">
    <div class="detail-title" id="detail-title">FAVORIT</div>
    <button class="detail-close" onclick="closeDetail()">✕ Schließen</button>
  </div>
  <div class="detail-content" id="detail-content"></div>
</div>

<script>
const FH_KEY='d9jr0g1r01qr77bnrgh0d9jr0g1r01qr77bnrghg';
const FH='https://finnhub.io/api/v1';
let lang='de',theme='dark';
let mainRD=null,mainCD=null,compareRD=null,compareCD=null;
let acTimer=null,acTimer2=null;
let recentTickers=JSON.parse(localStorage.getItem('fa_recent')||'[]');

// ── THEME/LANG ──────────────────────────────
function toggleTheme(){theme=theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);document.getElementById('theme-btn').textContent=theme==='dark'?'☀ LIGHT':'☾ DARK';reRenderAllCharts();}
function toggleLang(){
  lang=lang==='de'?'en':'de';
  document.documentElement.setAttribute('data-lang',lang);
  document.getElementById('lang-btn').textContent=lang==='de'?'EN':'DE';
  document.getElementById('slabel-text').textContent=lang==='de'?'Ticker oder Firmenname eingeben':'Enter ticker or company name';
  document.getElementById('pdf-btn').textContent=lang==='de'?'⬇ PDF exportieren':'⬇ Export PDF';
  document.getElementById('compare-label-text').textContent=lang==='de'?'Vergleichs-Ticker:':'Compare ticker:';
  document.getElementById('compare-sbtn').textContent=lang==='de'?'Vergleichen':'Compare';
}

// ── TABS ────────────────────────────────────
function switchTab(n){
  ['analyse','favs'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===n);
    document.getElementById('panel-'+t).classList.toggle('active',t===n);
  });
  if(n==='favs')renderFavs();
}

// ── STORAGE ─────────────────────────────────
function getFavs(){try{return JSON.parse(localStorage.getItem('fa_favs')||'[]');}catch{return[];}}
function saveFavs(a){localStorage.setItem('fa_favs',JSON.stringify(a));}
function isFav(t){return getFavs().some(f=>f.ticker===t);}
function addFav(e){let f=getFavs().filter(x=>x.ticker!==e.ticker);f.unshift(e);saveFavs(f);}
function removeFav(t){saveFavs(getFavs().filter(f=>f.ticker!==t));}
function addRecent(t){recentTickers=[t,...recentTickers.filter(x=>x!==t)].slice(0,5);localStorage.setItem('fa_recent',JSON.stringify(recentTickers));}
function toggleFav(ticker,slot){
  if(isFav(ticker)){
    removeFav(ticker);
    document.querySelectorAll(`.star-btn[data-ticker="${ticker}"]`).forEach(b=>{b.textContent='☆';});
  } else {
    const rd=slot==='compare'?compareRD:mainRD;
    const cd=slot==='compare'?compareCD:mainCD;
    if(rd&&rd.ticker===ticker){
      addFav({ticker,companyName:rd.p?.name||ticker,industry:rd.p?.finnhubIndustry||'',price:rd.price,rating:rd.R?.tot||null,timestamp:new Date().toISOString(),rd,cd});
    }
    document.querySelectorAll(`.star-btn[data-ticker="${ticker}"]`).forEach(b=>{b.textContent='★';});
  }
}

// ── STATUS ──────────────────────────────────
function setStatus(msg,type=''){const el=document.getElementById('status');el.className='status '+type;el.innerHTML=type==='loading'?`<span class="spin"></span>${msg}`:msg;}

// ── FETCH ───────────────────────────────────
async function fh(path,params={}){const p=new URLSearchParams({...params,token:FH_KEY});const r=await fetch(`${FH}${path}?${p}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}
async function fhS(path,params={}){try{return await fh(path,params);}catch(e){console.warn(path,e.message);return null;}}

// ── AUTOCOMPLETE ────────────────────────────
function setupAC(inputId,dropId,isCompare=false){
  const inp=document.getElementById(inputId);
  const drop=document.getElementById(dropId);
  const timer=isCompare?'acTimer2':'acTimer';

  inp.addEventListener('focus',()=>{
    if(!inp.value.trim()&&recentTickers.length){
      showRecent(drop);
    }
  });
  inp.addEventListener('input',()=>{
    const q=inp.value.trim();
    clearTimeout(window[timer]);
    if(!q){showRecent(drop);return;}
    window[timer]=setTimeout(async()=>{
      const res=await fhS('/search',{q,limit:8});
      const items=(res?.result||[]).filter(x=>x.type==='Common Stock'||x.type==='EQS'||!x.type);
      if(!items.length){drop.classList.remove('visible');return;}
      drop.innerHTML=items.map(x=>`<div class="ac-item" onclick="selectAC('${x.symbol}','${(x.description||'').replace(/'/g,"\\'")}','${dropId}','${inputId}',${isCompare})">
        <span class="ac-ticker">${x.symbol}</span>
        <span class="ac-name">${(x.description||'').substring(0,40)}</span>
        <span class="ac-type">${x.type||''}</span>
      </div>`).join('');
      drop.classList.add('visible');
    },300);
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){drop.classList.remove('visible');if(isCompare)startCompare();else startAnalysis();}
    if(e.key==='Escape')drop.classList.remove('visible');
  });
}
function showRecent(drop){
  if(!recentTickers.length){drop.classList.remove('visible');return;}
  drop.innerHTML=`<div class="ac-sep">${lang==='de'?'Zuletzt gesucht':'Recent searches'}</div>`
    +recentTickers.map(t=>`<div class="ac-item" onclick="document.getElementById('ticker-input').value='${t}';document.getElementById('autocomplete').classList.remove('visible');startAnalysis()">
      <span class="ac-ticker">${t}</span><span class="ac-name" style="color:var(--txd)">${lang==='de'?'Zuletzt gesucht':'Recent'}</span>
    </div>`).join('');
  drop.classList.add('visible');
}
function selectAC(symbol,name,dropId,inputId,isCompare){
  document.getElementById(inputId).value=symbol;
  document.getElementById(dropId).classList.remove('visible');
  if(isCompare)startCompare();else startAnalysis();
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap')&&!e.target.closest('#compare-strip')){
    document.getElementById('autocomplete').classList.remove('visible');
    document.getElementById('autocomplete2').classList.remove('visible');
  }
});

// ── UTILS ───────────────────────────────────
function n(v){const x=parseFloat(v);return isNaN(x)||!isFinite(x)?null:x;}
function nf(v,d=2,s=''){const x=n(v);return x===null?null:x.toFixed(d)+s;}
function fmtB(v){const x=n(v);if(x===null)return null;if(Math.abs(x)>=1e12)return(x/1e12).toFixed(2)+' T';if(Math.abs(x)>=1e9)return(x/1e9).toFixed(2)+' B';if(Math.abs(x)>=1e6)return(x/1e6).toFixed(2)+' M';return x.toLocaleString();}
function isDE(t){return t.endsWith('.DE')||t.endsWith('.F');}
function findVal(items,...keys){if(!Array.isArray(items))return null;for(const key of keys){const kl=key.toLowerCase();const found=items.find(x=>(x.label||x.concept||'').toLowerCase().includes(kl));if(found){const v=n(found.value);if(v!==null)return v;}}return null;}
function parseReports(data){if(!data?.data)return[];return data.data.filter(r=>r.form==='10-K').slice(0,5);}

// ── RATINGS ─────────────────────────────────
function computeRatings(d){
  function sc(v,g,ok,b,inv=false){if(v===null||isNaN(v))return null;if(!inv)return v>=g?9:v>=ok?6:v>=b?3:2;return v<=g?9:v<=ok?6:v<=b?3:2;}
  function cl(v){return v===null?null:Math.max(1,Math.min(10,Math.round(v)));}
  const scores=[],lde=[],len=[],nde=[],nen=[];
  function push(lD,lE,r,nD,nE){if(r===null)return;scores.push(r);lde.push(lD);len.push(lE);nde.push(nD);nen.push(nE);}

  const s1gm=sc(d.gm,0.5,0.3,0.15),s1r=sc(d.rev5,0.15,0.07,0.02);
  if(s1gm!==null||s1r!==null){
    const r=cl(((s1gm||5)+(s1r||5))/2);
    push('Geschäftsmodell & Wettbewerbsposition','Business Model & Competitive Position',r,
      d.gm?`Bruttomarge ${(d.gm*100).toFixed(1)}% — ${d.gm>0.4?'starkes Preissetzungsvermögen':d.gm>0.25?'solide Margenstruktur':'schwache Margenstruktur'}`:'',
      d.gm?`Gross margin ${(d.gm*100).toFixed(1)}% — ${d.gm>0.4?'strong pricing power':d.gm>0.25?'solid margin structure':'weak margin structure'}`:'');
  }
  const s2v=[sc(d.rev5,0.15,0.07,0.02),sc(d.roe,0.2,0.12,0.06),sc(d.roic,0.15,0.09,0.04),sc(d.de,0.5,1.5,3,true)].filter(v=>v!==null);
  if(s2v.length){
    const r=cl(s2v.reduce((a,b)=>a+b,0)/s2v.length);
    push('Finanzkennzahlen','Financial Metrics',r,
      d.roe?`ROE ${(d.roe*100).toFixed(1)}%${d.roic?', ROIC '+(d.roic*100).toFixed(1)+'%':''} — ${d.roe>0.15?'gute Kapitalrendite':'moderate Kapitalrendite'}`:'',
      d.roe?`ROE ${(d.roe*100).toFixed(1)}%${d.roic?', ROIC '+(d.roic*100).toFixed(1)+'%':''} — ${d.roe>0.15?'strong capital returns':'moderate capital returns'}`:'');
  }
  let vs=null;if(d.pe!==null&&!isNaN(d.pe))vs=d.pe<12?9:d.pe<18?7:d.pe<28?5:d.pe<40?3:2;
  const v2=d.ev!==null?(d.ev<10?9:d.ev<18?6:d.ev<30?4:2):null;
  const s3v=[vs,v2].filter(v=>v!==null);
  if(s3v.length){
    const r=cl(s3v.reduce((a,b)=>a+b,0)/s3v.length);
    push('Bewertung','Valuation',r,
      d.pe?`KGV ${Number(d.pe).toFixed(1)}${d.ev?' / EV/EBITDA '+Number(d.ev).toFixed(1)+'x':''} — ${d.pe<18?'attraktiv':d.pe<30?'fair':'Premium'}`:'',
      d.pe?`P/E ${Number(d.pe).toFixed(1)}${d.ev?' / EV/EBITDA '+Number(d.ev).toFixed(1)+'x':''} — ${d.pe<18?'attractive':d.pe<30?'fair':'premium'}`:'');
  }
  if(d.roic!==null){
    const r=cl(sc(d.roic,0.18,0.10,0.05));
    push('Management & Kapitalallokation','Management & Capital Allocation',r,
      `ROIC ${(d.roic*100).toFixed(1)}% — ${d.roic>0.12?'gute Kapitalallokation':'moderate Kapitalallokation'}`,
      `ROIC ${(d.roic*100).toFixed(1)}% — ${d.roic>0.12?'good capital allocation':'moderate capital allocation'}`);
  }
  if(d.rev5!==null){
    const r=cl(sc(d.rev5,0.2,0.1,0.03));
    push('Wachstumspotenzial','Growth Potential',r,
      `Umsatz-CAGR 5J: ${(d.rev5*100).toFixed(1)}% — ${d.rev5>0.1?'starkes Wachstum als Katalysator':'moderates Wachstumspotenzial'}`,
      `Revenue CAGR 5Y: ${(d.rev5*100).toFixed(1)}% — ${d.rev5>0.1?'strong organic growth catalyst':'moderate growth potential'}`);
  }
  // DCF-Abstand Rating
  if(d.dcfResult?.fairValue&&d.price){
    const pct=(d.price-d.dcfResult.fairValue)/d.dcfResult.fairValue*100;
    let r;
    if(pct<=-40)r=10;else if(pct<=-20)r=8;else if(pct<=-5)r=7;else if(pct<=5)r=5;else if(pct<=20)r=4;else if(pct<=40)r=3;else r=1;
    const absPct=Math.abs(pct).toFixed(1);
    const dir=pct<0?(lang==='de'?'unter':'below'):(lang==='de'?'über':'above');
    const dirDE=pct<0?'unter':'über';
    const qual=r>=8?'sehr attraktiv':r>=7?'attraktiv':r===5?'fair bewertet':r<=3?'stark überbewertet':'überbewertet';
    const qualEN=r>=8?'very attractive':r>=7?'attractive':r===5?'fairly valued':r<=3?'strongly overvalued':'overvalued';
    push('DCF-Bewertungsabstand','DCF Valuation Gap',r,
      `${absPct}% ${dirDE} Fair Value (${qual})`,
      `${absPct}% ${dir} fair value (${qualEN})`);
  }
  const tot=scores.length?cl(scores.reduce((a,b)=>a+b,0)/scores.length):null;
  return{scores,tot,lde,len,nde,nen};
}

// ── DCF ─────────────────────────────────────
function dcfEst(fcfArr,shares,beta){
  try{
    const vals=fcfArr.filter(v=>v!==null&&v>0);
    if(!vals.length||!shares||shares<=0)return null;
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    const betaV=n(beta)||1.0;
    const wacc=0.04+betaV*0.055;
    const fcfGrowth=vals.length>=2?Math.max(-0.05,Math.min(0.20,Math.pow(vals[vals.length-1]/vals[0],1/(vals.length-1))-1)):0.05;
    const g=0.025,N=5;
    let pv=0;for(let i=1;i<=N;i++)pv+=(avg*Math.pow(1+fcfGrowth,i))/Math.pow(1+wacc,i);
    const tv=(avg*Math.pow(1+fcfGrowth,N)*(1+g))/((wacc-g)*Math.pow(1+wacc,N));
    return{fairValue:(pv+tv)/shares,wacc,fcfGrowth,g,beta:betaV};
  }catch{return null;}
}

  const el=document.getElementById(id);if(!el)return;
  if(charts[id]){try{charts[id].destroy();}catch{}}
  const c=getC(),de=lang==='de';
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:c.t,font:{family:"'Courier New',monospace",size:11}}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}},y:{grid:{color:c.g},ticks:{color:c.t,font:{size:10}}}}};
  const baseId=id.replace(/\d$/,'');

  if(baseId==='chart-pe'){
    charts[id]=new Chart(el,{type:'line',data:{labels:cd.yrs,datasets:[{label:de?'KGV':'P/E',data:cd.peH,borderColor:c.a,backgroundColor:c.a+'18',borderWidth:2,pointBackgroundColor:c.a,pointRadius:4,fill:true,tension:0.3,spanGaps:false}]},options:{...base}});
  }
  if(baseId==='chart-mg'){
    charts[id]=new Chart(el,{type:'line',data:{labels:cd.yrs,datasets:[
      {label:de?'Brutto %':'Gross %',data:cd.gmH,borderColor:c.a,borderWidth:2,pointRadius:4,tension:0.3,fill:false,spanGaps:true},
      {label:de?'Op. %':'Op. %',data:cd.omH,borderColor:c.b,borderWidth:2,pointRadius:4,tension:0.3,fill:false,spanGaps:true},
      {label:de?'Netto %':'Net %',data:cd.nmH,borderColor:c.w,borderWidth:2,pointRadius:4,tension:0.3,fill:false,spanGaps:true}
    ]},options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...base.scales.y.ticks,callback:v=>v!=null?v.toFixed(1)+'%':null}}}}});
  }
  if(baseId==='chart-rv'){
    charts[id]=new Chart(el,{type:'bar',data:{labels:cd.yrs,datasets:[
      {label:de?'Umsatz (Mrd.)':'Revenue (B)',data:cd.revH.map(v=>v!=null?(v/1e9).toFixed(2):null),backgroundColor:c.a+'55',borderColor:c.a,borderWidth:1,yAxisID:'y'},
      {label:'Net Debt/EBITDA',data:cd.ndH,type:'line',borderColor:c.d,backgroundColor:'transparent',borderWidth:2,pointRadius:4,yAxisID:'y1',tension:0.3,spanGaps:true}
    ]},options:{...base,scales:{x:base.scales.x,y:{...base.scales.y,position:'left',title:{display:true,text:de?'Mrd. USD':'B USD',color:c.t,font:{size:10}}},y1:{...base.scales.y,position:'right',grid:{drawOnChartArea:false},title:{display:true,text:'ND/EBITDA',color:c.d,font:{size:10}}}}}});
  }
  if(baseId==='chart-dcf'&&cd.price){
    const cp=cd.price,ath=cd.ath||cp*1.4,dcfVal=cd.dcfResult?.fairValue||null;
    const maxY=Math.max(cp,ath,dcfVal||0)*1.28;
    charts[id]=new Chart(el,{type:'bar',
      data:{labels:[cd.ticker],datasets:[{data:[maxY],backgroundColor:c.a+'10',borderColor:c.bd,borderWidth:1}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{grid:{color:c.g},ticks:{color:c.t}},y:{min:0,max:maxY,grid:{color:c.g},ticks:{color:c.t,callback:v=>'$'+v.toFixed(0)}}}},
      plugins:[{id:'dcfL',afterDraw(chart){
        const{ctx,chartArea,scales}=chart;if(!chartArea)return;
        const yS=scales.y,x0=chartArea.left,x1=chartArea.right;
        // Durchgezogen: Aktueller Kurs
        function solidLine(val,color,label,offY=0){
          if(val==null||isNaN(val))return;
          const y=yS.getPixelForValue(val);
          ctx.save();ctx.strokeStyle=color;ctx.lineWidth=3;ctx.setLineDash([]);
          ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
          ctx.fillStyle=color;ctx.font='bold 11px Courier New,monospace';ctx.textAlign='left';
          ctx.fillText(label+': $'+Number(val).toFixed(2),x0+8,y-6+offY);ctx.restore();
        }
        // Gestrichelt: 52W-Hoch und DCF
        function dashLine(val,color,label,offY=0){
          if(val==null||isNaN(val))return;
          const y=yS.getPixelForValue(val);
          ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([6,4]);
          ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
          ctx.setLineDash([]);ctx.fillStyle=color;ctx.font='bold 11px Courier New,monospace';ctx.textAlign='left';
          ctx.fillText(label+': $'+Number(val).toFixed(2),x0+8,y-6+offY);ctx.restore();
        }
        const athY=yS.getPixelForValue(ath),cpY=yS.getPixelForValue(cp);
        dashLine(ath,c.b,de?'52W-Hoch':'52W-High',0);
        solidLine(cp,c.a,de?'Aktueller Kurs':'Current Price',Math.abs(athY-cpY)<22?14:0);
        if(dcfVal){const dcfY=yS.getPixelForValue(dcfVal);dashLine(dcfVal,c.w,de?'Fairer Wert (DCF)':'DCF Fair Value',Math.abs(cpY-dcfY)<22?14:0);}
        if(cd.dcfResult){
          const dr=cd.dcfResult;
          ctx.save();ctx.fillStyle=c.t;ctx.font='9px Courier New,monospace';ctx.textAlign='right';
          ctx.fillText(`WACC ${(dr.wacc*100).toFixed(1)}% · FCF-g ${(dr.fcfGrowth*100).toFixed(1)}% · β ${dr.beta.toFixed(2)}`,x1-6,chartArea.bottom-6);
          ctx.restore();
        }
      }}]
    });
  }
}

// ── CORE DATA FETCH ─────────────────────────
async function fetchTickerData(ticker){
  const isGerman=isDE(ticker);
  const [quote,profile,metrics]=await Promise.all([fh('/quote',{symbol:ticker}),fhS('/stock/profile2',{symbol:ticker}),fhS('/stock/metric',{symbol:ticker,metric:'all'})]);
  if(!quote||(!quote.c&&!quote.pc))throw new Error(`Ticker "${ticker}" nicht gefunden.`);
  const m=metrics?.metric||{};
  const p=profile||{};
  const price=n(quote.c),change=n(quote.d)||0,chgPct=n(quote.dp)||0;
  const high52=n(m['52WeekHigh'])||n(quote.h);
  const low52=n(m['52WeekLow'])||n(quote.l);
  const pe=n(m.peBasicExclExtraTTM)||n(m.peTTM)||null;
  const pb=n(m.pbQuarterly)||n(m.pbAnnual)||null;
  const ps=n(m.psTTM)||null;
  const ev=n(m.evEbitdaTTM)||null;
  const roe=n(m.roeTTM)!==null?n(m.roeTTM)/100:null;
  const roic=n(m.roicTTM)!==null?n(m.roicTTM)/100:(n(m.roic)!==null?n(m.roic)/100:null);
  const gm=n(m.grossMarginTTM)!==null?n(m.grossMarginTTM)/100:(n(m.grossMarginAnnual)!==null?n(m.grossMarginAnnual)/100:null);
  const om=n(m.operatingMarginTTM)!==null?n(m.operatingMarginTTM)/100:null;
  const nm=n(m.netProfitMarginTTM)!==null?n(m.netProfitMarginTTM)/100:(n(m.netMarginTTM)!==null?n(m.netMarginTTM)/100:null);
  const de2=n(m.totalDebt_totalEquityAnnual)||null;
  const cr=n(m.currentRatioAnnual)||n(m.currentRatioQuarterly)||null;
  const eps=n(m.epsBasicExclExtraItemsTTM)||n(m.epsTTM)||null;
  const beta=n(m.beta)||null;
  const divY=n(m.dividendYieldIndicatedAnnual)||null;
  const mktCap=n(p.marketCapitalization)?n(p.marketCapitalization)*1e6:null;
  const sharesOut=n(m.sharesOutstanding)?n(m.sharesOutstanding)*1e6:(n(p.shareOutstanding)?n(p.shareOutstanding)*1e6:null);
  const peg=n(m.pegRatio)||null;
  const ndEbitda=n(m.netDebtToEbitda)||null;
  const fcfPerShare=n(m.freeCashFlowPerShareTTM)||n(m.fcfPerShareTTM)||null;
  // 52W Position in %
  const pos52=high52&&low52&&high52>low52?Math.round((price-low52)/(high52-low52)*100):null;
  // EPS CAGR — aus earnings
  let epsCagr=null;
  if(!isGerman){
    const earn=await fhS('/stock/earnings',{symbol:ticker,limit:20});
    const annual=(earn||[]).filter(e=>e.period&&e.period.endsWith('-12')||e.period&&e.period.includes('FY'));
    if(annual.length>=4){
      const eps0=n(annual[annual.length-1]?.actual),epsN=n(annual[0]?.actual);
      if(eps0&&epsN&&eps0>0)epsCagr=Math.pow(epsN/eps0,1/(annual.length-1))-1;
    }
  }

  let yrs=[],revH=[],gmH=[],omH=[],nmH=[],ndH=[],peH=[],fcfArr=[],rev5=null,dcfResult=null;

  if(!isGerman){
    const reported=await fhS('/stock/financials-reported',{symbol:ticker,freq:'annual'});
    const reports=parseReports(reported);
    for(const rep of reports){
      const year=rep.startDate?.substring(0,4)||rep.endDate?.substring(0,4)||'';
      if(year)yrs.unshift(year);
      const ic=rep.report?.ic||[],bs=rep.report?.bs||[],cf=rep.report?.cf||[];
      const rev=findVal(ic,'Revenues','Revenue','Net revenue','Total revenue','Sales');
      const gp=findVal(ic,'Gross profit');
      const oi=findVal(ic,'Operating income','Operating profit','Income from operations');
      const ni=findVal(ic,'Net income','Net earnings');
      const ltd=findVal(bs,'Long-term debt','LongTermDebt');
      const std=findVal(bs,'Short-term debt','ShortTermDebt');
      const cash=findVal(bs,'Cash and cash equivalents');
      const ebitda=findVal(ic,'EBITDA')||(oi!==null&&findVal(ic,'Depreciation')!==null?oi+findVal(ic,'Depreciation'):null);
      const opcf=findVal(cf,'Net cash from operating','Cash from operations','Operating activities');
      const capex=findVal(cf,'Capital expenditures','Payments for property','Purchase of property');
      revH.unshift(rev);
      gmH.unshift(rev&&gp?+(gp/rev*100).toFixed(2):null);
      omH.unshift(rev&&oi?+(oi/rev*100).toFixed(2):null);
      nmH.unshift(rev&&ni?+(ni/rev*100).toFixed(2):null);
      const td=(ltd||0)+(std||0);
      ndH.unshift(td&&cash!=null&&ebitda&&ebitda>0?+((td-cash)/ebitda).toFixed(2):null);
      fcfArr.unshift(opcf!==null&&capex!==null?opcf-Math.abs(capex):null);
    }
    const rv=revH.filter(v=>v!==null);
    if(rv.length>=2&&rv[0]>0)rev5=Math.pow(rv[rv.length-1]/rv[0],1/(rv.length-1))-1;
    // KGV historisch
    for(let i=0;i<yrs.length;i++){
      const yr=parseInt(yrs[i]);if(isNaN(yr)){peH.push(null);continue;}
      const from=Math.floor(new Date(yr,11,28)/1000);
      const to=Math.floor(new Date(yr,11,31,23,59)/1000);
      const candle=await fhS('/stock/candle',{symbol:ticker,resolution:'D',from,to});
      const closeP=candle?.c?.length?candle.c[candle.c.length-1]:null;
      peH.push(closeP&&eps&&eps>0?+(closeP/eps).toFixed(1):null);
    }
    dcfResult=dcfEst(fcfArr,sharesOut,beta);
  }

  const R=computeRatings({gm,roe,roic,de:de2,pe,ev,rev5,dcfResult,price});
  return{
    ticker,p,quote,m,R,price,high52,low52,mktCap,pe,ev,pb,ps,roe,roic,gm,om,nm,
    de:de2,cr,eps,rev5,dcfResult,beta,divY,change,chgPct,sharesOut,isGerman,
    peg,ndEbitda,fcfPerShare,pos52,epsCagr,
    chartData:yrs.length?{yrs,revH,gmH,omH,nmH,peH,ndH,price,ath:high52,dcfResult,ticker}:null
  };
}

// ── MAIN ANALYSIS ───────────────────────────
async function startAnalysis(){
  const ticker=document.getElementById('ticker-input').value.trim().toUpperCase();
  if(!ticker){setStatus(lang==='de'?'Bitte Ticker eingeben.':'Please enter a ticker.','error');return;}
  document.getElementById('sbtn').disabled=true;
  document.getElementById('autocomplete').classList.remove('visible');
  const grid=document.getElementById('results-grid');
  grid.className='';grid.innerHTML='';
  killCharts();mainRD=null;mainCD=null;
  setStatus(lang==='de'?'Analyse läuft…':'Analysing…','loading');
  try{
    const d=await fetchTickerData(ticker);
    mainRD=d;mainCD=d.chartData;
    addRecent(ticker);
    setStatus('✓ '+(lang==='de'?'Abgeschlossen':'Complete')+' — '+(d.p.name||ticker),'ok');
    grid.innerHTML=`<div id="slot-main"></div>`;
    renderResult(d,'slot-main','main');
  }catch(e){setStatus('Fehler: '+e.message,'error');console.error(e);}
  document.getElementById('sbtn').disabled=false;
}

// ── COMPARE ─────────────────────────────────
function openCompareStrip(){
  document.getElementById('compare-strip').classList.add('visible');
  document.getElementById('compare-input').focus();
}
async function startCompare(){
  const ticker=document.getElementById('compare-input').value.trim().toUpperCase();
  if(!ticker)return;
  document.getElementById('compare-sbtn').disabled=true;
  document.getElementById('autocomplete2').classList.remove('visible');
  try{
    const d=await fetchTickerData(ticker);
    compareRD=d;compareCD=d.chartData;
    addRecent(ticker);
    const grid=document.getElementById('results-grid');
    grid.className='compare-mode';
    if(!document.getElementById('slot-compare'))grid.innerHTML+=`<div id="slot-compare"></div>`;
    renderResult(d,'slot-compare','compare');
  }catch(e){alert('Fehler: '+e.message);}
  document.getElementById('compare-sbtn').disabled=false;
}
function closeCompare(){
  document.getElementById('compare-strip').classList.remove('visible');
  document.getElementById('compare-input').value='';
  const el=document.getElementById('slot-compare');if(el)el.remove();
  document.getElementById('results-grid').className='';
  compareRD=null;compareCD=null;
}

// ── RENDER RESULT ───────────────────────────
function renderResult(d,containerId,slot){
  const de=lang==='de',c=document.getElementById(containerId);
  const sign=d.change>=0?'+':'',pnc=d.change>=0?'pos':'neg';
  const name=d.p.name||d.ticker;
  const fav=isFav(d.ticker);
  const tot=d.R.tot;
  const ampelColor=tot>=7?'green':tot>=5?'yellow':'red';
  const ampelText=tot>=7?(de?'Solide':'Solid'):tot>=5?(de?'Gemischt':'Mixed'):(de?'Schwach':'Weak');
  const now=new Date();
  const ts=now.toLocaleDateString(de?'de-DE':'en-US',{day:'2-digit',month:'2-digit',year:'numeric'})+', '+now.toLocaleTimeString(de?'de-DE':'en-US',{hour:'2-digit',minute:'2-digit'});

  // Logo
  const logoUrl=d.p.logo;
  const logoHtml=logoUrl?`<img class="co-logo" src="${logoUrl}" alt="${name} logo" onerror="this.style.display='none'">`:`<div class="co-logo-placeholder">${d.ticker.substring(0,3)}</div>`;

  // Ampel
  const ampelHtml=tot?`<div class="ampel"><div class="ampel-dot ${ampelColor}"></div><span>${tot}/10 — ${ampelText}</span></div>`:'';

  // Header
  const headerHtml=`<div class="cohead">
    <div class="cohead-top">
      <div class="cohead-left">
        ${logoHtml}
        <div>
          <div class="coname">${name}</div>
          <div class="cometa">${d.ticker} · ${d.p.exchange||''} · ${d.p.finnhubIndustry||''} · ${d.p.country||''}</div>
          ${d.p.description?`<div class="codesc">${d.p.description.substring(0,220)}${d.p.description.length>220?'…':''}</div>`:''}
          <div class="timestamp">${de?'Stand':'As of'}: ${ts}</div>
        </div>
      </div>
      <div class="coright">
        <button class="star-btn" data-ticker="${d.ticker}" onclick="toggleFav('${d.ticker}','${slot}')" title="">${fav?'★':'☆'}</button>
        <div class="pval">${d.price?'$'+Number(d.price).toFixed(2):'N/A'}</div>
        <div class="pchg ${pnc}">${sign}${d.change.toFixed(2)} (${sign}${d.chgPct.toFixed(2)}%)</div>
        <div class="cometa">52W: $${d.low52?d.low52.toFixed(2):'?'} – $${d.high52?d.high52.toFixed(2):'?'}</div>
      </div>
    </div>
    <div class="cohead-actions">
      ${ampelHtml}
      <button class="compare-open-btn" onclick="openCompareStrip()">${de?'⇄ Vergleichen':'⇄ Compare'}</button>
    </div>
  </div>`;

  // Metrics
  const explains=de?EXPLAINS_DE:EXPLAINS_EN;
  const suffix=slot==='compare'?'-c':'';
  const cards=[
    {l:'KGV / P/E',v:nf(d.pe,1,'x'),cls:'a',ex:explains['KGV / P/E']},
    {l:'EV/EBITDA',v:nf(d.ev,1,'x'),cls:'',ex:explains['EV/EBITDA']},
    {l:'KBV / P/B',v:nf(d.pb,2,'x'),cls:'',ex:explains['KBV / P/B']},
    {l:'KUV / P/S',v:nf(d.ps,2,'x'),cls:'',ex:explains['KUV / P/S']},
    {l:'ROE (TTM)',v:d.roe!==null?nf(d.roe*100,1,'%'):null,cls:'b',ex:explains['ROE (TTM)']},
    {l:'ROIC (TTM)',v:d.roic!==null?nf(d.roic*100,1,'%'):null,cls:'b',ex:explains['ROIC (TTM)']},
    {l:de?'Bruttomarge':'Gross Margin',v:d.gm!==null?nf(d.gm*100,1,'%'):null,cls:'',ex:explains['Bruttomarge']},
    {l:de?'Nettomarge':'Net Margin',v:d.nm!==null?nf(d.nm*100,1,'%'):null,cls:'',ex:explains['Nettomarge']},
    {l:de?'Marktkapitalisierung':'Market Cap',v:fmtB(d.mktCap),cls:'',ex:explains['Marktkapitalisierung']},
    {l:'EPS (TTM)',v:d.eps!==null?'$'+nf(d.eps,2):null,cls:'',ex:explains['EPS (TTM)']},
    {l:de?'Umsatz-CAGR 5J':'Rev. CAGR 5Y',v:d.rev5!==null?nf(d.rev5*100,1,'%'):null,cls:'',ex:explains['Umsatz-CAGR 5J']},
    {l:'DCF '+(de?'Fairer Wert':'Fair Value'),v:d.dcfResult?.fairValue?'$'+d.dcfResult.fairValue.toFixed(2):null,cls:'a',ex:explains['DCF Fairer Wert']},
    {l:'PEG-Ratio',v:nf(d.peg,2,'x'),cls:d.peg&&d.peg<1?'g':d.peg&&d.peg>2?'r':'',ex:explains['PEG-Ratio']},
    {l:'Net Debt/EBITDA',v:nf(d.ndEbitda,2,'x'),cls:d.ndEbitda!==null&&d.ndEbitda<0?'g':d.ndEbitda!==null&&d.ndEbitda>4?'r':'',ex:explains['Net Debt/EBITDA']},
    {l:'EPS-CAGR 5J',v:d.epsCagr!==null?nf(d.epsCagr*100,1,'%'):null,cls:'',ex:explains['EPS-CAGR 5J']},
    {l:'52W-Position',v:d.pos52!==null?d.pos52+'%':null,cls:d.pos52!==null&&d.pos52<30?'g':d.pos52!==null&&d.pos52>80?'r':'',ex:explains['52W-Position']},
    {l:de?'FCF je Aktie':'FCF per Share',v:d.fcfPerShare!==null?'$'+nf(d.fcfPerShare,2):null,cls:'',ex:explains['FCF je Aktie']},
  ].filter(x=>x.v!==null);

  const finHtml=cards.length?`<div class="mgrid">${cards.map((mc,i)=>{
    const cid=`mcard-${slot}-${i}`;
    return`<div class="mcard" id="${cid}" onclick="toggleMcard('${cid}')">
      <div class="mlabel">${mc.l}</div>
      <div class="mval ${mc.cls}">${mc.v}</div>
      ${mc.ex?`<div class="mcard-explain">${mc.ex}</div>`:''}
    </div>`;
  }).join('')}</div>`:`<p style="color:var(--txd);font-family:var(--mono);font-size:0.82rem">${de?'Keine Daten verfügbar.':'No data available.'}</p>`;

  // Table
  const R=d.R,bc=r=>r>=7?'hi':r>=5?'mi':'lo';
  let tableHtml='';
  if(R.scores.length){
    const tDE=R.tot>=7?`${name} zeigt mit ${R.tot}/10 solide Fundamentaldaten — mittelfristig investierbar.`:R.tot>=5?`${name} zeigt mit ${R.tot}/10 gemischte Fundamentaldaten.`:`${name} zeigt mit ${R.tot}/10 schwache Fundamentaldaten.`;
    const tEN=R.tot>=7?`${name} shows solid fundamentals at ${R.tot}/10 — investable medium-term.`:R.tot>=5?`${name} shows mixed fundamentals at ${R.tot}/10.`:`${name} shows weak fundamentals at ${R.tot}/10.`;
    tableHtml=`<div class="twrap"><table><thead><tr><th style="width:42%">${de?'Bereich':'Dimension'}</th><th style="width:12%">Rating</th><th>${de?'Einschätzung':'Assessment'}</th></tr></thead><tbody>
      ${R.scores.map((r,i)=>`<tr><td><strong>${i+1}. ${de?R.lde[i]:R.len[i]}</strong></td><td><span class="badge ${bc(r)}">${r}/10</span></td><td style="font-size:0.81rem;color:var(--txm)">${de?R.nde[i]:R.nen[i]}</td></tr>`).join('')}
      <tr class="sumrow"><td>${de?'Gesamtbewertung':'Overall Rating'}</td><td><span class="badge tot">${R.tot}/10</span></td><td style="font-size:0.81rem">${de?tDE:tEN}</td></tr>
    </tbody></table></div>`;
  } else {tableHtml=`<p style="color:var(--txd);font-family:var(--mono);font-size:0.82rem">${de?'Nicht genug Daten.':'Not enough data.'}</p>`;}

  // Charts
  const cd=d.chartData;
  let chartsHtml='';
  if(cd){
    const sfx=slot==='compare'?'2':'';
    const btns=[];
    if(cd.peH?.some(v=>v!==null))btns.push(makeChartAcc(`chart-pe${sfx}`,de?'📈 KGV-Verlauf':'📈 P/E History',cd,`chart-pe${sfx}`));
    if(cd.gmH?.some(v=>v!==null))btns.push(makeChartAcc(`chart-mg${sfx}`,de?'📊 Margenentwicklung':'📊 Margin Development',cd,`chart-mg${sfx}`));
    if(cd.revH?.some(v=>v!==null))btns.push(makeChartAcc(`chart-rv${sfx}`,de?'📦 Umsatz & Net Debt/EBITDA':'📦 Revenue & Net Debt/EBITDA',cd,`chart-rv${sfx}`));
    if(cd.price)btns.push(makeChartAcc(`chart-dcf${sfx}`,de?'💹 Kursspanne & DCF':'💹 Price Range & DCF',cd,`chart-dcf${sfx}`,'dcfwrap'));
    chartsHtml=btns.length?btns.join(''):`<p style="color:var(--txd);font-family:var(--mono);font-size:0.82rem">${de?'Keine Charts verfügbar.':'No charts available.'}</p>`;
  } else {chartsHtml=`<p style="color:var(--txd);font-family:var(--mono);font-size:0.82rem">${de?'Keine historischen Daten (nur US-Ticker).':'No historical data (US tickers only).'}</p>`;}

  const disclaimer=`<div class="disclaimer">${de?'⚠ Keine Anlageberatung. Kursdaten & Metriken: Finnhub API (Free). Jahresabschlüsse: SEC 10-K. DCF: WACC aus Beta (rf=4%, rm=5.5%), FCF-Wachstum aus Verlauf, ewige Wachstumsrate 2.5%. Vollständige Analyse nur für US-Ticker.':'⚠ Not financial advice. Data: Finnhub API (free). Financials: SEC 10-K. DCF: WACC from beta (rf=4%, rm=5.5%), FCF growth from history, perpetual growth 2.5%. Full analysis for US tickers only.'}</div>`;

  c.innerHTML=headerHtml
    +makeAcc(`fin${suffix}`,de?'💰 Finanzdaten':'💰 Financial Data',finHtml,true)
    +makeAcc(`tab${suffix}`,de?'📋 Bewertungstabelle':'📋 Rating Table',tableHtml,false)
    +makeAcc(`charts${suffix}`,de?'📈 Grafiken':'📈 Charts',chartsHtml,false)
    +disclaimer;
}

function makeAcc(id,label,content,startOpen=false){
  return`<div class="acc-section"><button class="acc-btn${startOpen?' open':''}" onclick="toggleAcc(this,document.getElementById('acc-body-${id}'))"><span>${label}</span><span class="acc-arrow">▼</span></button><div class="acc-body${startOpen?' open':''}" id="acc-body-${id}">${content}</div></div>`;
}
function makeChartAcc(id,label,cd,chartId,wrapClass='cwrap'){
  return`<div><button class="chart-acc-btn" onclick="openChartAcc(this,'cbody-${id}','${chartId}')"><span>${label}</span><span class="acc-arrow" style="font-size:0.68rem">▼</span></button><div class="chart-acc-body" id="cbody-${id}"><div class="${wrapClass}"><canvas id="${chartId}"></canvas></div></div></div>`;
}
function toggleAcc(btnEl,bodyEl){const open=bodyEl.classList.toggle('open');btnEl.classList.toggle('open',open);}
function openChartAcc(btnEl,bodyId,chartId){
  const body=document.getElementById(bodyId);
  const open=body.classList.toggle('open');
  btnEl.classList.toggle('open',open);
  if(open){
    const cd=chartId.endsWith('2')?compareCD:mainCD;
    if(cd)setTimeout(()=>drawChart(chartId,cd),30);
  }
}
function toggleMcard(id){
  const el=document.getElementById(id);
  if(!el)return;
  el.classList.toggle('expanded');
}

// ── PDF EXPORT ──────────────────────────────
function exportPDF(){
  // Alle Akkordeons öffnen für Druck
  document.querySelectorAll('.acc-body').forEach(b=>{b.classList.add('open');});
  document.querySelectorAll('.chart-acc-body').forEach(b=>{b.classList.add('open');});
  setTimeout(()=>{window.print();},300);
}

// ── FAVORITES ───────────────────────────────
function renderFavs(){
  const favs=getFavs(),el=document.getElementById('favs-list'),de=lang==='de';
  if(!favs.length){el.innerHTML=`<div class="fav-empty">${de?'— Noch keine Favoriten —\nKlicke beim Analysieren auf den ☆ Stern':'— No favorites yet —\nClick the ☆ star while analysing'}</div>`;return;}
  el.innerHTML=`<div class="fav-grid">${favs.map(f=>{
    const bc=f.rating>=7?'hi':f.rating>=5?'mi':'lo';
    const ds=new Date(f.timestamp).toLocaleDateString(de?'de-DE':'en-US',{day:'2-digit',month:'2-digit',year:'numeric'});
    return`<div class="fav-card" onclick="openFavDetail('${f.ticker}')">
      <div class="fav-ticker">${f.ticker}</div>
      <div class="fav-name">${f.companyName||''}</div>
      <div class="fav-meta">${f.industry||''}</div>
      <div class="fav-meta">${de?'Gespeichert':'Saved'}: ${ds}</div>
      <div class="fav-footer">
        ${f.rating?`<span class="badge ${bc}">${f.rating}/10</span>`:'<span></span>'}
        <button class="fav-del" onclick="event.stopPropagation();removeFav('${f.ticker}');renderFavs()">${de?'✕ Entfernen':'✕ Remove'}</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function openFavDetail(ticker){
  const item=getFavs().find(f=>f.ticker===ticker);if(!item?.rd)return;
  document.getElementById('detail-title').textContent=`${ticker} — ${item.companyName||''}`;
  document.getElementById('detail-content').innerHTML='<div id="fav-inner"></div>';
  document.getElementById('detail-view').classList.add('on');
  document.body.style.overflow='hidden';
  // Temporär als main setzen für Charts
  mainRD=item.rd;mainCD=item.cd||null;
  killCharts();
  renderResult(item.rd,'fav-inner','main');
}
function closeDetail(){document.getElementById('detail-view').classList.remove('on');document.body.style.overflow='';killCharts();mainRD=null;mainCD=null;}

setupAC('compare-input','autocomplete2',true);
document.getElementById('compare-input').addEventListener('keydown',e=>{if(e.key==='Enter')startCompare();});
